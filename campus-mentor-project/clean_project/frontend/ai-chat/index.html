<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>뻔뻔하게 · AI 대화</title>
  <link rel="stylesheet" href="../chat/style.css" />
</head>
<body>
  <div class="chat-app">
    <section class="chat-view" id="chat-view">
      <nav class="back-bar">
        <a class="back-link" href="../main.html">← 메인으로</a>
      </nav>

      <div class="top-bar">
        <img class="brand-logo" src="../chat/assets/logo.png" alt="" />
        <div class="brand-text">
          <strong class="brand-name">뻔뻔하게</strong>
          <span class="role-badge junior">후배로 접속 중</span>
        </div>
        <nav class="top-menu" aria-label="대화 메뉴">
          <button type="button" class="menu-btn" id="reset-btn">초기화</button>
        </nav>
      </div>

      <header class="mentor-card">
        <div class="avatar" id="partner-avatar">🤖</div>
        <div class="mentor-info">
          <p class="partner-label">대화 상대</p>
          <h1 id="partner-name">AI 선배</h1>
          <p class="mentor-meta" id="partner-meta">선배 · 학과 통합 가이드</p>
          <p class="mentor-intro" id="partner-intro">미리 정리된 멘토링 대화 데이터를 바탕으로 학교생활·진로 고민을 도와드려요.</p>
        </div>
      </header>

      <main class="messages" id="messages" aria-live="polite"></main>

      <section class="suggestions" id="suggestions" aria-label="추천 질문">
        <p class="suggestions-label">이렇게 물어볼 수 있어요</p>
        <div class="suggestion-list" id="suggestion-list"></div>
      </section>

      <div class="composer-area">
        <form class="composer" id="composer">
          <button type="button" class="reaction-toggle" aria-label="AI">🤖</button>
          <textarea id="message-input" rows="1" aria-label="메시지 입력" placeholder="AI 선배에게 궁금한 점을 물어보세요"></textarea>
          <button type="submit" id="send-btn" disabled>전송</button>
        </form>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
