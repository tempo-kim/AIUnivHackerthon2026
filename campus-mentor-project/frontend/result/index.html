<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>추천 선배 | 뻔뻔하게</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8ff;color:#1b2451;font-family:Pretendard,'Malgun Gothic',sans-serif}header{max-width:1080px;margin:auto;padding:24px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:22px;font-weight:900;color:#283c91;text-decoration:none}.home{color:#647092;text-decoration:none;font-size:14px}main{max-width:1000px;margin:48px auto 120px;padding:0 24px}.badge{display:inline-block;background:#edeaff;color:#6140c4;padding:9px 14px;border-radius:30px;font-weight:700;font-size:13px}h1{font-size:clamp(30px,4vw,42px);letter-spacing:-.05em;margin:20px 0 10px}.intro{line-height:1.7;color:#72809b}.notice{background:#f0efff;color:#546286;padding:14px 17px;border-radius:12px;font-size:13px;line-height:1.6;margin:25px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid #e1e5f5;border-radius:22px;padding:24px;box-shadow:0 18px 50px #30346b0d;display:flex;flex-direction:column}.avatar{width:52px;height:52px;border-radius:18px;background:#edeaff;color:#6140c4;display:grid;place-items:center;font-size:22px;font-weight:700}.card h2{font-size:20px;margin:18px 0 5px}.meta{color:#7f8aa3;font-size:13px;margin:0}.reason{line-height:1.7;color:#66728f;font-size:14px;flex:1;margin:20px 0}.button{display:block;text-align:center;text-decoration:none;background:#345fe0;color:white;padding:14px;border-radius:12px;font-size:14px;font-weight:700}.button:hover{background:#254bc1}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e5f3;display:flex;justify-content:center;gap:8px;padding:10px 20px calc(10px + env(safe-area-inset-bottom))}.nav a{color:#687398;text-decoration:none;text-align:center;padding:8px 45px;border-radius:12px;font-size:13px}.nav span{display:block;font-size:20px;margin-bottom:3px}@media(max-width:760px){main{margin:25px auto 110px}.grid{grid-template-columns:1fr}.nav a{padding:8px 35px}}

.logo{display:inline-flex;align-items:center;line-height:0}.logo img{display:block;width:150px;height:90px;object-fit:contain;mix-blend-mode:multiply}@media(max-width:760px){.logo img{width:120px;height:72px}}
.result-tools{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.result-tools button,.favorite{font:inherit;border:1px solid #ded9fa;border-radius:12px;padding:12px 16px;background:white;color:#6140c4;cursor:pointer}.result-tools button[aria-pressed="true"],.favorite[aria-pressed="true"]{background:#edeaff}.result-tools button:disabled{opacity:.5;cursor:not-allowed}.favorite{align-self:flex-end;margin-bottom:12px}.result-tools button:focus-visible,.favorite:focus-visible{outline:3px solid #7656e2;outline-offset:2px}</style></head><body>
<header>
  <a class="logo" href="../main.html">
    <img src="../assets/brand-logo.png" alt="뻔뻔하게 홈">
  </a>
  <a class="home" href="../main.html">← 처음으로</a>
</header>

<main>
  <span class="badge">나와 함께할 선배 찾기</span>
  <h1>어떤 선배와 이야기해 볼까요?</h1>
  <p class="intro">선배의 이야기를 살펴보고 편하게 대화를 시작해 보세요.</p>
  <p class="notice" id="notice">추천 결과를 확인하고 있어요.</p><p class="meta" id="analysis-status" aria-live="polite"></p>
<p class="hint" id="analysis-source"></p>
  <div class="result-tools"><button type="button" id="show-recommended" aria-pressed="true">추천 선배</button><button type="button" id="show-favorites" aria-pressed="false">♡ 관심 선배</button><button type="button" id="reroll">↻ 다른 선배 보기</button></div><p class="meta">찜 목록은 이 브라우저에 저장돼요.</p><p id="result-feedback" class="notice" role="status" hidden></p><div class="grid" id="mentors"></div><p id="retry" hidden><a class="home" href="../main.html">← 처음부터 다시 입력하기</a></p>
</main>

<nav class="nav" aria-label="하단 메뉴">
  <a href="../main.html"><span>☘</span>홈</a>
  <a href="#" id="open-chat"><span>💬</span>채팅</a>
</nav>
<script src="../assets/achievements.js"></script>
<script>
const list=document.querySelector('#mentors');
const notice=document.querySelector('#notice');
const retry=document.querySelector('#retry');
const nextMatch=document.querySelector('#reroll');
const chatUrl=id=>'../chat/index.html?role=junior&mentor='+encodeURIComponent(id);
let result=null;
try{result=JSON.parse(sessionStorage.getItem('ppunppun-match')||'null')}catch(e){}
let favoritesOnly=false;
function favoriteKey(){try{const user=JSON.parse(localStorage.getItem('ppunppun-junior-session')||'null');return 'ppunppun-favorites-v1:'+encodeURIComponent(user?.junior_id||'guest')}catch(e){return 'ppunppun-favorites-v1:guest'}}
function loadFavorites(){try{const data=JSON.parse(localStorage.getItem(favoriteKey())||'[]');return Array.isArray(data)?data.filter(m=>m&&m.mentor_id):[]}catch(e){return []}}
function feedback(text){const el=document.querySelector('#result-feedback');el.textContent=text;el.hidden=!text}
function renderMatches(){
list.replaceChildren();retry.hidden=true;
const matches=favoritesOnly?loadFavorites():(Array.isArray(result?.matches)?result.matches:[]);
document.querySelector('#show-recommended').setAttribute('aria-pressed',String(!favoritesOnly));
document.querySelector('#show-favorites').setAttribute('aria-pressed',String(favoritesOnly));
  nextMatch.disabled=favoritesOnly;
const status=document.querySelector('#analysis-status');
if(result){
  const singleLlm=result.extraction_source==='llm'&&result.recommendation_source==='llm';
  const extractionLabel=({llm:'LLM이 고민 내용을 분석',stub:'규칙 기반 분석',client:'입력된 조건 사용'})[result.extraction_source]||'분석 방식 확인 불가';
  const recommendationLabel=result.recommendation_source==='llm'?'LLM이 후보 선배를 최종 비교':'규칙 기반 후보 정렬';
  status.textContent=singleLlm
    ?'분석 방식: LLM 한 번이 핵심 키워드, 상황 요약, 선배 적합도, 상위 3명과 추천 이유를 함께 판단'
    :`분석 방식: ${extractionLabel} · 추천 방식: ${recommendationLabel}`;
}
if(favoritesOnly&&!matches.length){notice.textContent='아직 찜한 선배가 없어요. 추천 카드에서 ♡ 찜하기를 눌러 주세요.';
}else if(!favoritesOnly&&(!result||!Array.isArray(result.matches))){
  notice.textContent='아직 추천 결과가 없어요. 처음부터 고민을 입력해 주세요.';retry.hidden=false;
}else if(matches.length===0){
  notice.textContent='입력한 조건에 맞는 선배를 찾지 못했어요. 고민을 다시 작성해 주세요.';retry.hidden=false;
}else{
  notice.textContent=favoritesOnly?'찜한 선배들이에요. 저장 당시의 소개가 표시됩니다.':'입력한 고민을 바탕으로 추천한 선배예요.';
  PpunAchievements.award('recommendation');
  const analysisSource = document.querySelector('#analysis-source');
  if (analysisSource && result && !favoritesOnly) {
    analysisSource.textContent = result.extraction_source === 'llm' && result.recommendation_source === 'llm'
      ? '분석 방식: AI LLM 한 번의 응답으로 고민 키워드, 상황, 선배 적합도와 추천 이유를 만들었습니다.'
      : result.extraction_source === 'llm'
      ? '분석 방식: AI LLM이 고민 문장에서 관심사와 상황을 추출했습니다.'
      : '분석 방식: 규칙 기반 분석이 사용되었습니다.';
  }
  matches.forEach(mentor=>{
    const card=document.createElement('article');card.className='card';
    const avatar=document.createElement('div');avatar.className='avatar';avatar.setAttribute('aria-hidden','true');avatar.textContent=String(mentor.display_name||mentor.mentor_id||'?').charAt(0);
    const name=document.createElement('h2');name.textContent=String(mentor.display_name||mentor.mentor_id||'선배');
    const meta=document.createElement('p');meta.className='meta';meta.textContent=mentor.major||'';
    const bio=document.createElement('p');bio.className='reason';bio.textContent=mentor.bio||(Array.isArray(mentor.help_topics)?mentor.help_topics.join(' · '):'');
    if(mentor.mentor_id){
      const favorite=document.createElement('button');favorite.type='button';favorite.className='favorite';
      const selected=loadFavorites().some(m=>String(m.mentor_id)===String(mentor.mentor_id));
      favorite.textContent=selected?'♥ 찜 해제':'♡ 찜하기';favorite.setAttribute('aria-pressed',String(selected));favorite.setAttribute('aria-label',name.textContent+' '+favorite.textContent);
      favorite.onclick=()=>{const current=loadFavorites();const exists=current.some(m=>String(m.mentor_id)===String(mentor.mentor_id));const updated=exists?current.filter(m=>String(m.mentor_id)!==String(mentor.mentor_id)):[...current,mentor];try{localStorage.setItem(favoriteKey(),JSON.stringify(updated));feedback(exists?'관심 선배에서 해제했어요.':'관심 선배에 저장했어요.');renderMatches()}catch(e){feedback('브라우저 저장이 제한되어 찜 목록을 저장하지 못했어요.')}};
      card.append(favorite);
    }
    card.append(avatar,name,meta,bio);
    if(Array.isArray(mentor.reasons)&&mentor.reasons.length){const title=document.createElement('strong');title.textContent='추천 이유';const reasons=document.createElement('ul');reasons.className='reason';reasons.style.cssText='padding-left:20px;flex:none;margin-top:8px';mentor.reasons.forEach(reason=>{const item=document.createElement('li');item.textContent=String(reason);reasons.appendChild(item)});card.append(title,reasons)}
    if(mentor.mentor_id){const link=document.createElement('a');link.className='button';link.href=chatUrl(mentor.mentor_id);link.onclick=()=>{PpunAchievements.selectMentor(mentor.mentor_id);try{sessionStorage.setItem('ppunppun-selected-mentor',String(mentor.mentor_id))}catch(e){}};link.textContent='대화 시작하기 →';card.appendChild(link)}
    list.appendChild(card);
  });
  nextMatch.hidden=false;
}
nextMatch.onclick=async()=>{
  let offset=0;
  try{offset=Number(sessionStorage.getItem('ppunppun-match-offset')||'0')}catch(e){}
  const nextOffset=offset+3;
  nextMatch.disabled=true;
  nextMatch.textContent='다음 선배를 찾는 중...';
  notice.textContent='이전 추천 다음 순위의 선배를 찾고 있어요.';
  try{
    const concernText=sessionStorage.getItem('ppunppun-concern')||'';
    let choice=null;
    try{choice=JSON.parse(sessionStorage.getItem('ppunppun-choice')||'null')}catch(e){}
    const base=location.protocol==='file:'?'http://127.0.0.1:8000':'';
    const extraction=(result&&result.extraction)?result.extraction:null;
    const response=await fetch(base+'/api/match',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({concern_text:concernText,choice:choice,extraction:extraction,top_k:3,rank_offset:nextOffset,use_llm:false})});
    if(!response.ok)throw new Error('요청 실패');
    const nextResult=await response.json();
    if(!Array.isArray(nextResult.matches)||nextResult.matches.length===0){
      notice.textContent='더 추천할 선배가 없어요.';
      nextMatch.disabled=false;
      nextMatch.textContent='다른 선배 보기';
      return;
    }
    sessionStorage.setItem('ppunppun-match-offset',String(nextOffset));
    sessionStorage.setItem('ppunppun-match',JSON.stringify(nextResult));
    location.reload();
  }catch(e){
    notice.textContent='다음 추천 요청에 실패했어요. 다시 시도해 주세요.';
    nextMatch.disabled=false;
    nextMatch.textContent='다시 매칭';
  }
};
document.querySelector('#analysis-status').hidden=favoritesOnly;
document.querySelector('#analysis-source').hidden=favoritesOnly;
}
renderMatches();
document.querySelector('#show-recommended').onclick=()=>{favoritesOnly=false;renderMatches()};
document.querySelector('#show-favorites').onclick=()=>{favoritesOnly=true;renderMatches()};
window.addEventListener('storage',()=>renderMatches());
const chatLink=document.querySelector('#open-chat');
chatLink.onclick=async event=>{event.preventDefault();
  const session=(()=>{try{return JSON.parse(localStorage.getItem('ppunppun-junior-session')||'null')}catch(e){return null}})();
  if(!session?.token){notice.textContent='채팅 기록을 보려면 후배 로그인이 필요해요.';return}
  notice.textContent='내 채팅 기록을 불러오고 있어요.';
  try{
    const response=await fetch('/api/junior-rooms',{headers:{Authorization:'Bearer '+session.token}});
    if(!response.ok)throw new Error();
    const rooms=await response.json();list.replaceChildren();favoritesOnly=false;retry.hidden=true;
    notice.textContent=rooms.length?'내 채팅 기록이에요.':'아직 채팅 기록이 없어요.';
    rooms.forEach(room=>{const link=document.createElement('a');link.className='card';link.style.cssText='text-decoration:none;color:inherit';link.href=chatUrl(room.mentorId);const name=document.createElement('h2');name.textContent=room.mentorName+' 선배';const preview=document.createElement('p');preview.className='reason';preview.textContent=room.lastMessage||'대화 기록';const status=document.createElement('p');status.className='meta';status.textContent=(room.status==='ended'?'종료된 대화':'대화 중')+' · '+new Date(room.lastAt).toLocaleString('ko-KR');link.append(name,preview,status);list.append(link)});
  }catch(e){notice.textContent='채팅 기록을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.'}
};
</script></body></html>
