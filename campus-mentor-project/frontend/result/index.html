<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>매칭 결과 · 뻔뻔하게</title>
  <link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
  <header>
    <div class="logo">🌱 뻔뻔하게</div>
    <a class="login" href="../concern/" style="text-decoration:none">다시 매칭</a>
  </header>
  <main>
    <div class="layout">
      <section>
        <span class="badge">Step 3 · 매칭 결과</span>
        <h1>맞는 선배를<br><span>찾았어요</span></h1>
        <p class="intro">채팅 연결은 다음 단계에서 붙입니다. 지금은 추천 결과까지입니다.</p>
      </section>
      <section class="card">
        <h2>추천 선배</h2>
        <div id="list"></div>
        <p class="error" id="empty" hidden>저장된 매칭 결과가 없습니다. 고민 입력부터 진행해 주세요.</p>
        <div class="actions">
          <button class="back" type="button" id="to-concern">고민 다시 쓰기</button>
          <button class="primary" type="button" id="to-chat">채팅은 추후 연결</button>
        </div>
      </section>
    </div>
  </main>
  <nav class="nav" aria-label="하단 메뉴">
    <a href="../main.html"><span>☘</span>시작</a>
    <a href="../concern/"><span>✍</span>고민 입력</a>
    <a class="active" href="./"><span>✨</span>매칭 결과</a>
    <a href="../chat/"><span>💬</span>채팅(추후)</a>
  </nav>
  <script>
    let result = null;
    try { result = JSON.parse(sessionStorage.getItem('ppunppun-match') || 'null'); } catch (e) {}

    document.querySelector('#to-concern').onclick = () => { location.href = '../concern/'; };
    document.querySelector('#to-chat').onclick = () => {
      alert('채팅은 다음 단계에서 연결합니다.');
    };

    const list = document.querySelector('#list');
    const empty = document.querySelector('#empty');

    if (!result) {
      empty.hidden = false;
    } else {
      (result.matches || []).forEach((m, i) => {
        const el = document.createElement('article');
        el.className = 'mentor';
        el.innerHTML = `
          <h3>${i + 1}. ${m.display_name || m.mentor_id} <span class="meta">(${m.score}점)</span></h3>
          <div class="meta">${m.major || ''} · ${m.mentor_id}</div>
          <p class="hint">${m.bio || ''}</p>
          <div class="tags">${(m.help_topics || []).map(t => `<span class="tag">${t}</span>`).join('')}</div>
          <ul class="reasons">${(m.reasons || []).map(r => `<li>${r}</li>`).join('')}</ul>`;
        list.appendChild(el);
      });

      if (!(result.matches || []).length) {
        empty.hidden = false;
        empty.textContent = '조건에 맞는 선배가 없습니다. 고민을 조금 더 구체적으로 적어보세요.';
      }
    }
  </script>
</body>
</html>
