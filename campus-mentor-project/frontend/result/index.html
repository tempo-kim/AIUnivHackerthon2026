<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>추천 선배 | 뻔뻔하게</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8ff;color:#1b2451;font-family:Pretendard,'Malgun Gothic',sans-serif}header{max-width:1080px;margin:auto;padding:24px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:22px;font-weight:900;color:#283c91;text-decoration:none}.home{color:#647092;text-decoration:none;font-size:14px}main{max-width:1000px;margin:48px auto 120px;padding:0 24px}.badge{display:inline-block;background:#edeaff;color:#6140c4;padding:9px 14px;border-radius:30px;font-weight:700;font-size:13px}h1{font-size:clamp(30px,4vw,42px);letter-spacing:-.05em;margin:20px 0 10px}.intro{line-height:1.7;color:#72809b}.notice{background:#f0efff;color:#546286;padding:14px 17px;border-radius:12px;font-size:13px;line-height:1.6;margin:25px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid #e1e5f5;border-radius:22px;padding:24px;box-shadow:0 18px 50px #30346b0d;display:flex;flex-direction:column}.avatar{width:52px;height:52px;border-radius:18px;background:#edeaff;color:#6140c4;display:grid;place-items:center;font-size:22px;font-weight:700}.card h2{font-size:20px;margin:18px 0 5px}.meta{color:#7f8aa3;font-size:13px;margin:0}.reason{line-height:1.7;color:#66728f;font-size:14px;flex:1;margin:20px 0}.button{display:block;text-align:center;text-decoration:none;background:#345fe0;color:white;padding:14px;border-radius:12px;font-size:14px;font-weight:700}.button:hover{background:#254bc1}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e5f3;display:flex;justify-content:center;gap:8px;padding:10px 20px calc(10px + env(safe-area-inset-bottom))}.nav a{color:#687398;text-decoration:none;text-align:center;padding:8px 45px;border-radius:12px;font-size:13px}.nav span{display:block;font-size:20px;margin-bottom:3px}@media(max-width:760px){main{margin:25px auto 110px}.grid{grid-template-columns:1fr}.nav a{padding:8px 35px}}

.logo{display:inline-flex;align-items:center;line-height:0}.logo img{display:block;width:150px;height:90px;object-fit:contain;mix-blend-mode:multiply}@media(max-width:760px){.logo img{width:120px;height:72px}}
</style></head><body>
<header>
  <a class="logo" href="../main.html">
    <img src="../assets/brand-logo.png" alt="뻔뻔하게 홈">
  </a>
  <a class="home" href="../main.html">← 처음으로</a>
</header>

<main>
  <span class="badge">나와 함께할 선배 찾기</span>
  <h1>어떤 선배와 이야기해 볼까요?</h1>
  <p class="intro">선배의 이야기를 살펴보고 편하게 대화를 시작해 보세요.</p>
  <p class="notice" id="notice">추천 결과를 확인하고 있어요.</p><p class="meta" id="analysis-status" aria-live="polite"></p>
  <div class="grid" id="mentors"></div><p id="retry" hidden><a class="home" href="../main.html">← 처음부터 다시 입력하기</a></p>
</main>

<nav class="nav" aria-label="하단 메뉴">
  <a href="../main.html"><span>☘</span>홈</a>
  <a href="#" id="open-chat"><span>💬</span>채팅</a>
</nav>
<script src="../assets/achievements.js"></script>
<script>
const list=document.querySelector('#mentors');
const notice=document.querySelector('#notice');
const retry=document.querySelector('#retry');
const chatUrl=id=>'../chat/index.html?role=junior&mentor='+encodeURIComponent(id);
let result=null;
try{result=JSON.parse(sessionStorage.getItem('ppunppun-match')||'null')}catch(e){}
const matches=Array.isArray(result?.matches)?result.matches:[];
const status=document.querySelector('#analysis-status');
if(result){status.textContent=({llm:'분석 방식: AI 언어 모델',stub:'분석 방식: 임시 키워드 분석 (AI 미사용)',client:'분석 방식: 입력된 조건 사용'})[result.extraction_source]||'분석 방식을 확인할 수 없어요.';}
if(!result||!Array.isArray(result.matches)){
  notice.textContent='아직 추천 결과가 없어요. 처음부터 고민을 입력해 주세요.';retry.hidden=false;
}else if(matches.length===0){
  notice.textContent='입력한 조건에 맞는 선배를 찾지 못했어요. 고민을 다시 작성해 주세요.';retry.hidden=false;
}else{
  notice.textContent='입력한 고민을 바탕으로 추천한 선배예요.';
  PpunAchievements.award('recommendation');
  matches.forEach(mentor=>{
    const card=document.createElement('article');card.className='card';
    const avatar=document.createElement('div');avatar.className='avatar';avatar.setAttribute('aria-hidden','true');avatar.textContent=String(mentor.display_name||mentor.mentor_id||'?').charAt(0);
    const name=document.createElement('h2');name.textContent=String(mentor.display_name||mentor.mentor_id||'선배');
    const meta=document.createElement('p');meta.className='meta';meta.textContent=mentor.major||'';
    const bio=document.createElement('p');bio.className='reason';bio.textContent=mentor.bio||(Array.isArray(mentor.help_topics)?mentor.help_topics.join(' · '):'');
    card.append(avatar,name,meta,bio);
    if(Array.isArray(mentor.reasons)&&mentor.reasons.length){const title=document.createElement('strong');title.textContent='추천 이유';const reasons=document.createElement('ul');reasons.className='reason';reasons.style.cssText='padding-left:20px;flex:none;margin-top:8px';mentor.reasons.forEach(reason=>{const item=document.createElement('li');item.textContent=String(reason);reasons.appendChild(item)});card.append(title,reasons)}
    if(mentor.mentor_id){const link=document.createElement('a');link.className='button';link.href=chatUrl(mentor.mentor_id);link.onclick=()=>{PpunAchievements.selectMentor(mentor.mentor_id);try{sessionStorage.setItem('ppunppun-selected-mentor',String(mentor.mentor_id))}catch(e){}};link.textContent='대화 시작하기 →';card.appendChild(link)}
    list.appendChild(card);
  });
}
const chatLink=document.querySelector('#open-chat');
chatLink.onclick=event=>{event.preventDefault();let id='';try{id=sessionStorage.getItem('ppunppun-selected-mentor')||''}catch(e){}if(id){location.href=chatUrl(id)}else{notice.textContent='먼저 추천 선배의 대화 시작하기를 눌러 주세요.';notice.scrollIntoView({behavior:'smooth',block:'center'})}};
</script></body></html>
