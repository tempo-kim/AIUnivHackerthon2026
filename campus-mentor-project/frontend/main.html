<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>뻔뻔하게</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f8ff;color:#1b2451;font-family:Pretendard,'Malgun Gothic',sans-serif}header{max-width:1080px;margin:auto;padding:24px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:22px;font-weight:900;color:#283c91}button{font:inherit;cursor:pointer}main{max-width:1050px;margin:45px auto 120px;padding:0 24px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}.badge{background:#edeaff;color:#6140c4;padding:9px 14px;border-radius:30px;font-weight:700;font-size:13px}h1{font-size:clamp(38px,5vw,60px);letter-spacing:-.06em;line-height:1.2;margin:28px 0 18px}h1 span{color:#6d49d4}.intro{color:#72809b;line-height:1.8}.card{background:white;border:1px solid #e1e5f5;border-radius:24px;padding:32px;box-shadow:0 18px 60px #30346b10}h2{font-size:24px;letter-spacing:-.04em;line-height:1.4;margin:0 0 10px}.hint{color:#8590a9;font-size:14px;line-height:1.6}.primary,.back{border:0;border-radius:12px;padding:15px 20px;font-weight:700}.primary{background:#345fe0;color:white;flex:1}.primary:disabled{opacity:.4;cursor:not-allowed}.back{background:#eef0fb;color:#546286}.start{width:100%;margin-top:14px}.top{display:flex;justify-content:space-between;font-size:13px;color:#7d9182}.progress{height:6px;border-radius:10px;background:#eef0fb;margin:15px 0 26px}.bar{height:100%;background:#7656e2;border-radius:10px}.choices{display:grid;gap:9px;margin-top:20px}.choice{border:1px solid #dce2f5;background:white;color:#28335e;text-align:left;border-radius:12px;padding:14px}.choice:hover,.choice.selected{border-color:#7656e2;background:#f2efff;color:#6140c4}.actions{display:flex;gap:10px;margin-top:22px}.note{font-size:12px;color:#919bb1;line-height:1.6;margin:16px 0 0}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e5f3;display:flex;justify-content:center;gap:8px;padding:10px 20px calc(10px + env(safe-area-inset-bottom));z-index:2}.nav a{color:#687398;text-decoration:none;text-align:center;padding:8px 45px;border-radius:12px;font-size:13px}.nav a:hover{background:#f0efff;color:#5e43c8}.nav span{display:block;font-size:20px;margin-bottom:3px}.notice{color:#72809b;font-size:13px;margin:15px 0 0}@media(max-width:760px){main{margin:25px auto 110px}.layout{grid-template-columns:1fr;gap:30px}.card{padding:24px}h1{margin:20px 0}.nav a{padding:8px 35px}}
.concern-input{width:100%;min-height:145px;resize:vertical;border:1px solid #dce2f5;border-radius:12px;padding:14px;font:inherit;line-height:1.7;color:#28335e}.prefix{background:#f0efff;border-radius:12px;padding:14px;line-height:1.7;color:#51478f;font-size:14px}.secondary{width:100%;margin-top:10px;background:#edeaff;color:#5c43b8;border:0;border-radius:12px;padding:15px;font-weight:700}
.outline-btn{display:block;width:100%;margin:10px 0 0;background:transparent;color:#5c43b8;border:1px solid #cfc6f5;border-radius:12px;padding:14px 15px;font-weight:700;text-align:center;white-space:normal;word-break:keep-all;cursor:pointer}
.outline-btn:hover{background:#f7f5ff}.role-note{font-size:13px;color:#72809b;line-height:1.6}
.logo{display:inline-flex;align-items:center;line-height:0}.logo img{display:block;width:150px;height:90px;object-fit:contain;mix-blend-mode:multiply}@media(max-width:760px){.logo img{width:120px;height:72px}}
</style></head><body><header><a class="logo" href="./main.html" style="text-decoration:none"><img src="./assets/brand-logo.png" alt="뻔뻔하게 홈"></a></header><main><div class="layout"><section><span class="badge">캠퍼스 생활, 뻔뻔하게 물어봐요</span><h1>궁금한 건<br><span>뻔뻔하게!</span></h1><p class="intro">학교생활의 사소한 질문부터 진로 고민까지.<br>나와 맞는 선배에게 편하게 물어보세요.</p></section><section class="card" id="app" aria-live="polite"></section></div></main><nav class="nav" aria-label="하단 메뉴"><a href="./main.html"><span>☘</span>홈</a><a href="./result/index.html" id="junior-chat-nav"><span>💬</span>채팅창</a></nav><script src="./universities.js"></script><script src="./assets/achievements.js"></script><script>
const app = document.querySelector('#app');

function configureChatNav(role){
  const link=document.querySelector('#junior-chat-nav');
  link.hidden=false;
  link.href=role==='senior'?'#senior-chat':'./result/index.html';
  if(role==='senior')link.setAttribute('aria-haspopup','dialog');
  else link.removeAttribute('aria-haspopup');
  link.onclick=role==='senior'?event=>{
    event.preventDefault();
    let dialog=document.querySelector('#senior-chat-dialog');
    if(!dialog){
      dialog=document.createElement('dialog');
      dialog.id='senior-chat-dialog';dialog.className='achievement-dialog';
      dialog.setAttribute('aria-labelledby','senior-chat-title');
      dialog.innerHTML='<div class="achievement-heading"><h2 id="senior-chat-title">후배와의 채팅</h2><button type="button" class="achievement-button">닫기</button></div><div class="achievement-item" style="margin-top:20px"><strong>대화 요청 연결을 준비하고 있어요</strong><p>선배 등록과 대화 요청이 연결되면 이곳에서 후배와의 채팅을 시작할 수 있어요.</p></div>';
      dialog.querySelector('button').onclick=()=>dialog.close();
      document.body.append(dialog);
    }
    dialog.showModal();
  }:null;
}

let selectedSchool = '';

try {
  selectedSchool = localStorage.getItem('ppunppun-school') || '';

  if (!schoolExamples.includes(selectedSchool)) {
    selectedSchool = '';
    localStorage.removeItem('ppunppun-school');
    sessionStorage.removeItem('ppunppun-school');
  }
} catch (e) {
  selectedSchool = '';
}

function renderSchool() {
  PpunAchievements.setRole("junior");
  configureChatNav('junior');
  app.innerHTML = `
    <span class="badge">함께할 학교 찾기</span>
    <h2 style="margin-top:20px">어느 학교에 다니시나요?</h2>
    <p class="hint">학교 이름을 검색하고 선택해 주세요.</p>
    <input
      class="choice"
      id="school-search"
      style="width:100%;font:inherit"
      type="search"
      placeholder="예: 고려대학교"
      aria-label="학교 이름 검색"
      autocomplete="off"
    >
    <div class="choices" id="school-results"></div>
    <p class="note">학교 목록은 공공데이터를 기준으로 합니다.</p>
    <p class="notice" id="login-message" role="status"></p>
  `;

  const input = app.querySelector('#school-search');
  const results = app.querySelector('#school-results');
  input.value = selectedSchool;

  function selectSchool(name) {
    selectedSchool = name;

    try {
      localStorage.setItem('ppunppun-school', name);
      sessionStorage.setItem('ppunppun-school', name);
    } catch (e) {}

    step = -1;
    render();
  }

  function update() {
    results.replaceChildren();
    const value = input.value.trim();

    if (!value) {
      const hint = document.createElement('p');
      hint.className = 'hint';
      hint.textContent = '학교 이름을 입력하면 검색 결과가 보여요.';
      results.appendChild(hint);
      return;
    }

    const matches = schoolExamples.filter(s =>
      s.toLowerCase().includes(value.toLowerCase())
    );

    matches.forEach(name => {
      const button = document.createElement('button');
      button.className = 'choice';
      button.type = 'button';
      button.textContent = name;
      button.onclick = () => selectSchool(name);
      results.appendChild(button);
    });

    if (!matches.length) {
      const hint = document.createElement('p');
      hint.className = 'hint';
      hint.textContent = '검색 결과가 없어요. 학교 이름을 다시 확인해 주세요.';
      results.appendChild(hint);
    }
  }

  input.maxLength = 100;
  input.oninput = update;
  update();
}

const answers = {
  status: '',
  reason: '',
  experience_preferences: [],
  concern: ''
};
let step = -1;
const steps = [
  {key:'status', title:'현재 어떤 단계인가요?', hint:'나에게 해당하는 항목을 선택해 주세요.', options:['신입생','재학생','졸업준비생','졸업생']},
  {key:'reason', title:'어떤 도움을 받고 싶나요?', hint:'가장 관심 있는 분야를 골라주세요.', options:['학교적응','밥집 추천','전공지식','진로와 취업','대외활동']},
  {key:'experience_preferences', title:'어떤 경험이 있는 선배를 원하나요?', hint:'최대 2개까지 선택할 수 있어요. 선택하지 않아도 추천받을 수 있습니다.', options:['비슷한 전공','비슷한 학년','취업 경험','인턴 경험','대외활동 경험','대학원·연구 경험','학교생활 경험'], multi:true},
  {key:'concern', title:'어떤 선배를 찾고 있나요?', hint:'아래 문장에 이어 원하는 이야기나 선배의 모습을 자유롭게 적어주세요.'}
];
const seniorAnswers={display_name:'',major:'',status:'',introduction:''};
let seniorStep=0,seniorPin='';
const SENIOR_SESSION_KEY='ppunppun-senior-session';
const PIN_RE=/^[0-9]{4,6}$/;
function apiBase(){return location.protocol==='file:'?'http://127.0.0.1:8000':''}
function savedSeniorSession(){try{const s=JSON.parse(localStorage.getItem(SENIOR_SESSION_KEY)||'null');return s&&s.mentor_id&&s.token?s:null}catch(e){return null}}
function goSeniorInbox(session){try{localStorage.setItem(SENIOR_SESSION_KEY,JSON.stringify({mentor_id:session.mentor_id,token:session.token}))}catch(e){}location.href='chat/index.html?role=senior&mentor='+encodeURIComponent(session.mentor_id)}
function pinInput(onChange){const input=document.createElement('input');input.className='choice';input.style.cssText='display:block;width:100%;margin-top:6px;font:inherit';input.type='password';input.inputMode='numeric';input.autocomplete='off';input.maxLength=6;input.placeholder='숫자 4~6자리';input.oninput=()=>{input.value=input.value.replace(/[^0-9]/g,'');onChange(input.value)};return input}
function renderSeniorLogin(){
  document.querySelector('#junior-chat-nav').hidden=true;
  const saved=savedSeniorSession();if(saved){goSeniorInbox(saved);return}
  app.innerHTML='<h2>선배 로그인</h2><p class="hint">등록할 때 정한 닉네임과 PIN을 입력해 주세요.</p><div class="choices"></div><div class="actions"><button class="back" id="senior-login-prev">이전</button><button class="primary" id="senior-login-submit" disabled>로그인</button></div><p class="notice" id="login-message" role="status"></p>';
  const box=app.querySelector('.choices'),submit=app.querySelector('#senior-login-submit'),notice=app.querySelector('#login-message');
  let name='',pin='';const update=()=>{submit.disabled=!name.trim()||!PIN_RE.test(pin)};
  const nameLabel=document.createElement('label');nameLabel.className='role-note';nameLabel.textContent='닉네임';const nameInput=document.createElement('input');nameInput.className='choice';nameInput.style.cssText='display:block;width:100%;margin-top:6px;font:inherit';nameInput.maxLength=30;nameInput.oninput=()=>{name=nameInput.value;update()};nameLabel.appendChild(nameInput);
  const pinLabel=document.createElement('label');pinLabel.className='role-note';pinLabel.textContent='PIN';pinLabel.appendChild(pinInput(v=>{pin=v;update()}));
  box.append(nameLabel,pinLabel);
  app.querySelector('#senior-login-prev').onclick=()=>{if(selectedSchool){step=-1;render()}else{renderSchool()}};
  submit.onclick=async()=>{
    submit.disabled=true;submit.textContent='확인 중...';notice.textContent='';
    let message='로그인하지 못했어요. 네트워크 연결을 확인하고 다시 시도해 주세요.';
    try{
      const res=await fetch(apiBase()+'/api/mentors/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({display_name:name.trim(),pin})});
      const data=await res.json().catch(()=>({}));
      if(res.ok){goSeniorInbox(data);return}
      if(typeof data.detail==='string')message=data.detail;
    }catch(e){}
    notice.textContent=message;submit.textContent='로그인';update();
  };
}
function renderSenior(){
  PpunAchievements.setRole("senior");
  configureChatNav('senior');
  const review=seniorStep===2;
  const titles=['선배님의 기본 정보를 알려주세요','후배에게 어떤 이야기를 들려줄 수 있나요?','작성한 내용을 확인해 주세요'];
  app.innerHTML=`<div class="top"><span>선배 소개 작성</span><strong>${seniorStep+1} / 3</strong></div><div class="progress"><div class="bar" style="width:${(seniorStep+1)/3*100}%"></div></div><h2>${titles[seniorStep]}</h2><p class="hint">${review?'내용을 확인하고 등록하면 바로 후배의 질문을 받을 수 있어요.':seniorStep===0?'후배에게 보여줄 닉네임과 전공, 학적을 적어주세요.':'수업, 학교생활, 진로, 밥집 등 경험과 도움을 줄 수 있는 내용을 자유롭게 적어주세요.'}</p><div class="choices"></div><div class="actions"><button class="back" id="senior-prev">이전</button><button class="primary" id="senior-next">${review?'선배 등록하기':'다음'}</button></div><p class="note">테스트에는 가상의 정보를 사용해 주세요.</p><p class="notice" id="login-message" role="status"></p>`;
  const box=app.querySelector('.choices'), next=app.querySelector('#senior-next'),notice=app.querySelector('#login-message');
  if(seniorStep===0){
    [['display_name','닉네임','예: 초록 선배'],['major','전공','예: 컴퓨터공학과'],['status','학년 또는 졸업 여부','예: 3학년 재학 중']].forEach(([key,label,placeholder])=>{const field=document.createElement('label');field.className='role-note';field.textContent=label;const input=document.createElement('input');input.className='choice';input.style.cssText='display:block;width:100%;margin-top:6px;font:inherit';input.placeholder=placeholder;input.maxLength=100;input.value=seniorAnswers[key];input.oninput=()=>{seniorAnswers[key]=input.value;update()};field.appendChild(input);box.appendChild(field)});
    const pinField=document.createElement('label');pinField.className='role-note';pinField.textContent='로그인 PIN (다시 접속할 때 닉네임과 함께 입력해요)';const pin=pinInput(v=>{seniorPin=v;update()});pin.value=seniorPin;pinField.appendChild(pin);box.appendChild(pinField);
    function update(){next.disabled=!seniorAnswers.display_name.trim()||!seniorAnswers.major.trim()||!seniorAnswers.status.trim()||!PIN_RE.test(seniorPin)}update();
  }else if(seniorStep===1){
    const area=document.createElement('textarea');area.className='concern-input';area.setAttribute('aria-label','선배 소개와 경험');area.placeholder='예: 자료구조를 수강했고, 학교 주변 혼밥하기 좋은 밥집을 잘 알아요. 후배의 고민을 편하게 들어줄게요.';area.maxLength=2000;area.value=seniorAnswers.introduction;area.oninput=()=>{seniorAnswers.introduction=area.value;next.disabled=!area.value.trim()};box.appendChild(area);next.disabled=!area.value.trim();
  }else{
    const summary=document.createElement('div');summary.className='prefix';summary.style.whiteSpace='pre-wrap';summary.textContent=`학교: ${selectedSchool}\n닉네임: ${seniorAnswers.display_name.trim()}\n전공: ${seniorAnswers.major.trim()}\n학년 또는 졸업 여부: ${seniorAnswers.status.trim()}\n\n소개와 경험\n${seniorAnswers.introduction.trim()}`;box.appendChild(summary);
    const download=document.createElement('button');download.className='secondary';download.textContent='테스트용 JSON 파일 내려받기';download.onclick=()=>{const data=seniorPayload();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='mentor-profile.json';document.body.appendChild(a);a.click();a.remove();PpunAchievements.award('profile-ready');setTimeout(()=>URL.revokeObjectURL(url),1000);notice.textContent='파일을 내려받았어요. 브라우저의 다운로드 목록을 확인해 주세요.'};box.appendChild(download);
  }
  app.querySelector('#senior-prev').onclick=()=>{if(seniorStep===0){step=-1;render()}else{seniorStep--;renderSenior()}};
  next.onclick=async()=>{
    if(!review){seniorStep++;renderSenior();return}
    const prev=app.querySelector('#senior-prev');
    next.disabled=true;prev.disabled=true;next.textContent='등록 중...';notice.textContent='';
    let message='등록하지 못했어요. 네트워크 연결을 확인하고 다시 시도해 주세요.';
    try{
      const {display_name,major,status,introduction}=seniorPayload();
      const res=await fetch(apiBase()+'/api/mentors/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({display_name,major,status,introduction,pin:seniorPin})});
      const data=await res.json().catch(()=>({}));
      if(res.ok){
        seniorPin='';
        try{PpunAchievements.award('introduction');if(introduction.length>=200)PpunAchievements.award('storyteller')}catch(e){}
        goSeniorInbox(data);return;
      }
      if(typeof data.detail==='string')message=data.detail;
    }catch(e){}
    notice.textContent=message;next.disabled=false;prev.disabled=false;next.textContent='선배 등록하기';
  };
}
function renderSeniorHome(){
  PpunAchievements.setRole("senior");
  configureChatNav('senior');
  app.innerHTML='<span class="badge">선배 공간</span><h2 style="margin-top:20px" id="senior-greeting"></h2><p class="hint" id="senior-school"></p><div class="prefix"><strong>내 소개</strong><p id="senior-intro" style="white-space:pre-wrap;margin-bottom:0"></p></div><div class="choices"><button class="secondary" id="edit-senior">내 소개 수정하기</button><div class="prefix"><strong>후배의 대화 요청</strong><p class="role-note">아직 연결된 대화 요청이 없어요. 선배 등록과 대화 요청 기능은 준비 중입니다.</p></div></div><button class="back" id="switch-role" style="margin-top:20px">처음으로</button><p class="note">작성한 소개는 이 브라우저 탭에 임시 저장되어 있어요.</p><p class="notice" id="login-message" role="status"></p>';
  app.querySelector('#senior-greeting').textContent=seniorAnswers.display_name.trim()+'님, 반가워요!';
  app.querySelector('#senior-school').textContent=selectedSchool+' · '+seniorAnswers.major.trim()+' · '+seniorAnswers.status.trim();
  app.querySelector('#senior-intro').textContent=seniorAnswers.introduction.trim();
  app.querySelector('#edit-senior').onclick=()=>{seniorStep=0;renderSenior()};
  app.querySelector('#switch-role').onclick=()=>{step=-1;render()};
}
function startSenior(){
  const session=savedSeniorSession();if(session){goSeniorInbox(session);return}
  try{const saved=JSON.parse(sessionStorage.getItem('ppunppun-senior-draft')||'null');if(saved&&saved.school===selectedSchool&&saved.display_name&&saved.major&&saved.status&&saved.introduction){Object.assign(seniorAnswers,{display_name:saved.display_name,major:saved.major,status:saved.status,introduction:saved.introduction});renderSeniorHome();return}}catch(e){}
  seniorStep=0;renderSenior();
}
function seniorPayload(){return {schema_version:1,school:selectedSchool,display_name:seniorAnswers.display_name.trim(),major:seniorAnswers.major.trim(),status:seniorAnswers.status.trim(),introduction:seniorAnswers.introduction.trim()}}
function render(){
  PpunAchievements.setRole("junior");
  configureChatNav('junior');
  if(step<0){
    app.innerHTML='<h2>무엇이든 물어볼 준비됐나요?</h2><p class="hint" id="school-label"></p><button class="back" id="change-school" type="button">학교 변경</button><p class="hint">나의 상황과 고민을 알려주면 어울리는 선배를 찾아볼 수 있어요.</p><button class="primary start" id="start">후배로 시작하기 →</button><button class="secondary" id="senior">선배로 시작하기</button><button class="outline-btn" id="senior-login" type="button">이미 등록했어요(로그인)</button><p class="notice" id="login-message" role="status"></p>';
    app.querySelector('#school-label').textContent='선택한 학교: '+selectedSchool;
    app.querySelector('#change-school').onclick=renderSchool;
    app.querySelector('#start').onclick=()=>{step=0;render()};
    app.querySelector('#senior').onclick=startSenior;
    app.querySelector('#senior-login').onclick=renderSeniorLogin;
    return;
  }
  const q=steps[step];
   app.innerHTML=`<div class="top"><span>${q.key==='concern'?'고민 작성':'기본 정보'}</span><strong>${step+1} / ${steps.length}</strong></div><div class="progress"><div class="bar" style="width:${(step+1)/steps.length*100}%"></div></div><h2>${q.title}</h2><p class="hint">${q.hint}</p><div class="choices"></div><div class="actions"><button class="back" id="prev">이전</button><button class="primary" id="next">${q.key==='concern'?'선배 추천받기':'다음'}</button></div><p class="note">추천받기를 누르면 작성한 내용이 선배 추천을 위해 서버로 전송됩니다.</p><p class="notice" id="login-message" role="status"></p>`;
  const box=app.querySelector('.choices'),next=app.querySelector('#next');
   if(q.options){
     q.options.forEach(option=>{const selected=q.multi?answers[q.key].includes(option):answers[q.key]===option;const button=document.createElement('button');button.className='choice'+(selected?' selected':'');button.textContent=option;button.setAttribute('aria-pressed',String(selected));button.onclick=()=>{if(q.multi){if(selected){answers[q.key]=answers[q.key].filter(item=>item!==option)}else if(answers[q.key].length<2){answers[q.key]=[...answers[q.key],option]}}else{answers[q.key]=option}render()};box.appendChild(button)});
     next.disabled=false;
  }else{
    const prefix=document.createElement('div');prefix.className='prefix';prefix.textContent=`저는 ${selectedSchool} ${answers.status}이고, ${answers.reason} 관련 이야기를 나눌 선배를 찾고 있어요.`;box.appendChild(prefix);
    const input=document.createElement('textarea');input.className='concern-input';input.setAttribute('aria-label','추가 고민');input.placeholder='예: 친절하게 이야기해 주고 학교 근처 밥집을 잘 아는 선배를 만나고 싶어요.';input.value=answers.concern;input.maxLength=2000;input.oninput=()=>{answers.concern=input.value};box.appendChild(input);
  }
  app.querySelector('#prev').onclick=()=>{step--;render()};
  next.onclick=async()=>{
    if(step<steps.length-1){step++;render();return}
    const intro=`저는 ${selectedSchool} ${answers.status}이고, ${answers.reason} 관련 이야기를 나눌 선배를 찾고 있어요.`;
    const text=[intro,answers.concern.trim()].filter(Boolean).join('\n');
    const choice = {
      status: answers.status,
      reason: answers.reason,
      experience_preferences: answers.experience_preferences,
      school: selectedSchool
    };
    const notice=app.querySelector('#login-message'),prev=app.querySelector('#prev');
    next.disabled=true;prev.disabled=true;next.textContent='추천 요청 중...';notice.textContent='';
     const controller=new AbortController();
     const timeout=setTimeout(()=>controller.abort(),5000);
    try{
      sessionStorage.setItem('ppunppun-choice',JSON.stringify(choice));
      sessionStorage.setItem('ppunppun-concern',text);
      const base=location.protocol==='file:'?'http://127.0.0.1:8000':'';
       const response=await fetch(base+'/api/match',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({concern_text:text,choice:choice,top_k:3,use_llm:true}),signal:controller.signal});
      if(!response.ok)throw new Error('요청 실패');
      const result=await response.json();sessionStorage.setItem('ppunppun-match',JSON.stringify(result));
      if(answers.concern.trim())PpunAchievements.award('concern');
      location.href='./result/index.html';
    }catch(e){notice.textContent='추천 요청에 실패했어요. 서버 연결을 확인한 뒤 다시 시도해 주세요.';next.disabled=false;prev.disabled=false;next.textContent='다시 시도'}
  };
}
if(new URLSearchParams(location.search).has('senior-login')){renderSeniorLogin()}else if(selectedSchool){render()}else{renderSchool()}
</script></body></html>
