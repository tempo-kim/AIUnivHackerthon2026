<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>뻔뻔하게</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f9f4;color:#25372b;font-family:Pretendard,'Malgun Gothic',sans-serif}header{max-width:1080px;margin:auto;padding:24px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:22px;font-weight:900;color:#358158}button{font:inherit;cursor:pointer}.login{border:1px solid #dce8dd;border-radius:12px;background:white;color:#617767;padding:10px 18px}main{max-width:1050px;margin:45px auto 120px;padding:0 24px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}.badge{background:#e1f2e6;color:#328359;padding:9px 14px;border-radius:30px;font-weight:700;font-size:13px}h1{font-size:clamp(38px,5vw,60px);letter-spacing:-.06em;line-height:1.2;margin:28px 0 18px}h1 span{color:#3e9664}.intro{color:#718579;line-height:1.8}.card{background:white;border:1px solid #e2ede3;border-radius:24px;padding:32px;box-shadow:0 18px 60px #274e3010}h2{font-size:24px;letter-spacing:-.04em;line-height:1.4;margin:0 0 10px}.hint{color:#829489;font-size:14px;line-height:1.6}.primary,.back{border:0;border-radius:12px;padding:15px 20px;font-weight:700}.primary{background:#398c5d;color:white;flex:1}.primary:disabled{opacity:.4;cursor:not-allowed}.back{background:#edf3ed;color:#55715e}.start{width:100%;margin-top:14px}.top{display:flex;justify-content:space-between;font-size:13px;color:#7d9182}.progress{height:6px;border-radius:10px;background:#edf3ed;margin:15px 0 26px}.bar{height:100%;background:#55aa78;border-radius:10px}.choices{display:grid;gap:9px;margin-top:20px}.choice{border:1px solid #dce8dd;background:white;color:#344b3b;text-align:left;border-radius:12px;padding:14px}.choice:hover,.choice.selected{border-color:#4ba774;background:#f0faf2;color:#257649}.actions{display:flex;gap:10px;margin-top:22px}.note{font-size:12px;color:#91a297;line-height:1.6;margin:16px 0 0}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e3ebe3;display:flex;justify-content:center;gap:8px;padding:10px 20px calc(10px + env(safe-area-inset-bottom));z-index:2}.nav a{color:#668072;text-decoration:none;text-align:center;padding:8px 45px;border-radius:12px;font-size:13px}.nav a:hover{background:#f0f8f1;color:#32845a}.nav span{display:block;font-size:20px;margin-bottom:3px}.notice{color:#72877a;font-size:13px;margin:15px 0 0}@media(max-width:760px){main{margin:25px auto 110px}.layout{grid-template-columns:1fr;gap:30px}.card{padding:24px}h1{margin:20px 0}.nav a{padding:8px 35px}}
.concern-input{width:100%;min-height:145px;resize:vertical;border:1px solid #dce8dd;border-radius:12px;padding:14px;font:inherit;line-height:1.7;color:#344b3b}.prefix{background:#f0f8f1;border-radius:12px;padding:14px;line-height:1.7;color:#3d6e50;font-size:14px}.secondary{width:100%;margin-top:10px;background:#eff6ef;color:#397a53;border:0;border-radius:12px;padding:15px;font-weight:700}.role-note{font-size:13px;color:#718579;line-height:1.6}</style></head><body><header><div class="logo">🌱 뻔뻔하게</div><button class="login" id="login" type="button">로그인</button></header><main><div class="layout"><section><span class="badge">캠퍼스 생활, 뻔뻔하게 물어봐요</span><h1>궁금한 건<br><span>뻔뻔하게!</span></h1><p class="intro">학교생활의 사소한 질문부터 진로 고민까지.<br>나와 맞는 선배에게 편하게 물어보세요.</p></section><section class="card" id="app" aria-live="polite"></section></div></main><nav class="nav" aria-label="하단 메뉴"><a href="./choice/"><span>☘</span>선택창</a><a href="./choice/index.html"><span>💬</span>채팅창</a></nav><script>
const app = document.querySelector('#app');
const answers = {status:'', reason:'', concern:''};
let step = -1;
const steps = [
  {key:'status', title:'현재 어떤 단계인가요?', hint:'나에게 해당하는 항목을 선택해 주세요.', options:['신입생','재학생','졸업준비생','졸업생']},
  {key:'reason', title:'어떤 도움을 받고 싶나요?', hint:'가장 관심 있는 분야를 골라주세요.', options:['학교적응','밥집 추천','전공지식','진로와 취업','대외활동']},
  {key:'concern', title:'어떤 선배를 찾고 있나요?', hint:'아래 문장에 이어 원하는 이야기나 선배의 모습을 자유롭게 적어주세요.'}
];
const seniorAnswers={display_name:'',major:'',status:'',introduction:''};
let seniorStep=0;
function renderSenior(){
  const review=seniorStep===2;
  const titles=['선배님의 기본 정보를 알려주세요','후배에게 어떤 이야기를 들려줄 수 있나요?','작성한 내용을 확인해 주세요'];
  app.innerHTML=`<div class="top"><span>선배 소개 작성</span><strong>${seniorStep+1} / 3</strong></div><div class="progress"><div class="bar" style="width:${(seniorStep+1)/3*100}%"></div></div><h2>${titles[seniorStep]}</h2><p class="hint">${review?'내용을 확인하고 임시 저장하거나 테스트 파일을 내려받을 수 있어요.':seniorStep===0?'후배에게 보여줄 닉네임과 전공, 학적을 적어주세요.':'수업, 학교생활, 진로, 밥집 등 경험과 도움을 줄 수 있는 내용을 자유롭게 적어주세요.'}</p><div class="choices"></div><div class="actions"><button class="back" id="senior-prev">이전</button><button class="primary" id="senior-next">${review?'임시 저장하기':'다음'}</button></div><p class="note">아직 실제 선배 등록은 되지 않아요. 테스트에는 가상의 정보를 사용해 주세요.</p><p class="notice" id="login-message" role="status"></p>`;
  const box=app.querySelector('.choices'), next=app.querySelector('#senior-next'),notice=app.querySelector('#login-message');
  if(seniorStep===0){
    [['display_name','닉네임','예: 초록 선배'],['major','전공','예: 컴퓨터공학과'],['status','학년 또는 졸업 여부','예: 3학년 재학 중']].forEach(([key,label,placeholder])=>{const field=document.createElement('label');field.className='role-note';field.textContent=label;const input=document.createElement('input');input.className='choice';input.style.cssText='display:block;width:100%;margin-top:6px;font:inherit';input.placeholder=placeholder;input.maxLength=100;input.value=seniorAnswers[key];input.oninput=()=>{seniorAnswers[key]=input.value;update()};field.appendChild(input);box.appendChild(field)});
    function update(){next.disabled=!seniorAnswers.display_name.trim()||!seniorAnswers.major.trim()||!seniorAnswers.status.trim()}update();
  }else if(seniorStep===1){
    const area=document.createElement('textarea');area.className='concern-input';area.setAttribute('aria-label','선배 소개와 경험');area.placeholder='예: 자료구조를 수강했고, 학교 주변 혼밥하기 좋은 밥집을 잘 알아요. 후배의 고민을 편하게 들어줄게요.';area.maxLength=2000;area.value=seniorAnswers.introduction;area.oninput=()=>{seniorAnswers.introduction=area.value;next.disabled=!area.value.trim()};box.appendChild(area);next.disabled=!area.value.trim();
  }else{
    const summary=document.createElement('div');summary.className='prefix';summary.style.whiteSpace='pre-wrap';summary.textContent=`닉네임: ${seniorAnswers.display_name.trim()}\n전공: ${seniorAnswers.major.trim()}\n학년 또는 졸업 여부: ${seniorAnswers.status.trim()}\n\n소개와 경험\n${seniorAnswers.introduction.trim()}`;box.appendChild(summary);
    const download=document.createElement('button');download.className='secondary';download.textContent='테스트용 JSON 파일 내려받기';download.onclick=()=>{const data=seniorPayload();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='mentor-profile.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notice.textContent='파일을 내려받았어요. 브라우저의 다운로드 목록을 확인해 주세요.'};box.appendChild(download);
  }
  app.querySelector('#senior-prev').onclick=()=>{if(seniorStep===0){step=-1;render()}else{seniorStep--;renderSenior()}};
  next.onclick=()=>{if(!review){seniorStep++;renderSenior();return}try{sessionStorage.setItem('ppunppun-senior-draft',JSON.stringify(seniorPayload()));notice.textContent='이 브라우저 탭에 임시 저장했어요. 실제 등록은 아직 되지 않았어요.'}catch(e){notice.textContent='임시 저장을 할 수 없어요. 브라우저 저장 설정을 확인해 주세요.'}};
}
function seniorPayload(){return {schema_version:1,display_name:seniorAnswers.display_name.trim(),major:seniorAnswers.major.trim(),status:seniorAnswers.status.trim(),introduction:seniorAnswers.introduction.trim()}}
function render(){
  if(step<0){
    app.innerHTML='<h2>무엇이든 물어볼 준비됐나요?</h2><p class="hint">나의 상황과 고민을 알려주면 어울리는 선배를 찾아볼 수 있어요.</p><button class="primary start" id="start">후배로 시작하기 →</button><button class="secondary" id="senior">선배로 시작하기</button><p class="notice" id="login-message" role="status"></p>';
    app.querySelector('#start').onclick=()=>{step=0;render()};
    app.querySelector('#senior').onclick=()=>{seniorStep=0;renderSenior()};
    return;
  }
  const q=steps[step];
  app.innerHTML=`<div class="top"><span>${step===2?'고민 작성':'기본 정보'}</span><strong>${step+1} / ${steps.length}</strong></div><div class="progress"><div class="bar" style="width:${(step+1)/steps.length*100}%"></div></div><h2>${q.title}</h2><p class="hint">${q.hint}</p><div class="choices"></div><div class="actions"><button class="back" id="prev">이전</button><button class="primary" id="next">${step===2?'선배 추천받기':'다음'}</button></div><p class="note">추천받기를 누르면 작성한 내용이 선배 추천을 위해 서버로 전송됩니다.</p><p class="notice" id="login-message" role="status"></p>`;
  const box=app.querySelector('.choices'),next=app.querySelector('#next');
  if(q.options){
    q.options.forEach(option=>{const button=document.createElement('button');button.className='choice'+(answers[q.key]===option?' selected':'');button.textContent=option;button.setAttribute('aria-pressed',String(answers[q.key]===option));button.onclick=()=>{answers[q.key]=option;render()};box.appendChild(button)});
    next.disabled=!answers[q.key];
  }else{
    const prefix=document.createElement('div');prefix.className='prefix';prefix.textContent=`저는 ${answers.status}이고 ${answers.reason}을(를) 위해 선배를 찾고 있어요.`;box.appendChild(prefix);
    const input=document.createElement('textarea');input.className='concern-input';input.setAttribute('aria-label','추가 고민');input.placeholder='예: 친절하게 이야기해 주고 학교 근처 밥집을 잘 아는 선배를 만나고 싶어요.';input.value=answers.concern;input.maxLength=2000;input.oninput=()=>{answers.concern=input.value};box.appendChild(input);
  }
  app.querySelector('#prev').onclick=()=>{step--;render()};
  next.onclick=async()=>{
    if(step<steps.length-1){step++;render();return}
    const intro=`저는 ${answers.status}이고 ${answers.reason}을(를) 위해 선배를 찾고 있어요.`;
    const text=[intro,answers.concern.trim()].filter(Boolean).join('\n');
    const choice={status:answers.status,reason:answers.reason};
    const notice=app.querySelector('#login-message'),prev=app.querySelector('#prev');
    next.disabled=true;prev.disabled=true;next.textContent='추천 요청 중...';notice.textContent='';
    try{
      sessionStorage.setItem('ppunppun-choice',JSON.stringify(choice));
      sessionStorage.setItem('ppunppun-concern',text);
      const base=location.protocol==='file:'?'http://127.0.0.1:8000':'';
      const response=await fetch(base+'/api/match',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({concern_text:text,top_k:3,use_llm:true})});
      if(!response.ok)throw new Error('요청 실패');
      const result=await response.json();sessionStorage.setItem('ppunppun-match',JSON.stringify(result));
      location.href='./result/';
    }catch(e){notice.textContent='추천 요청에 실패했어요. 서버 연결을 확인한 뒤 다시 시도해 주세요.';next.disabled=false;prev.disabled=false;next.textContent='다시 시도'}
  };
}
document.querySelector('#login').onclick=()=>{app.querySelector('#login-message').textContent='로그인 기능은 준비 중이에요.'};
render();
</script></body></html>
