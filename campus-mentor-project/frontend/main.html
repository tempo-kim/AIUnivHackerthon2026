<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>뻔뻔하게</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f9f4;color:#25372b;font-family:Pretendard,'Malgun Gothic',sans-serif}header{max-width:1080px;margin:auto;padding:24px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:22px;font-weight:900;color:#358158}button{font:inherit;cursor:pointer}.login{border:1px solid #dce8dd;border-radius:12px;background:white;color:#617767;padding:10px 18px}main{max-width:1050px;margin:45px auto 120px;padding:0 24px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}.badge{background:#e1f2e6;color:#328359;padding:9px 14px;border-radius:30px;font-weight:700;font-size:13px}h1{font-size:clamp(38px,5vw,60px);letter-spacing:-.06em;line-height:1.2;margin:28px 0 18px}h1 span{color:#3e9664}.intro{color:#718579;line-height:1.8}.card{background:white;border:1px solid #e2ede3;border-radius:24px;padding:32px;box-shadow:0 18px 60px #274e3010}h2{font-size:24px;letter-spacing:-.04em;line-height:1.4;margin:0 0 10px}.hint{color:#829489;font-size:14px;line-height:1.6}.primary,.back{border:0;border-radius:12px;padding:15px 20px;font-weight:700}.primary{background:#398c5d;color:white;flex:1}.primary:disabled{opacity:.4;cursor:not-allowed}.back{background:#edf3ed;color:#55715e}.start{width:100%;margin-top:14px}.top{display:flex;justify-content:space-between;font-size:13px;color:#7d9182}.progress{height:6px;border-radius:10px;background:#edf3ed;margin:15px 0 26px}.bar{height:100%;background:#55aa78;border-radius:10px}.choices{display:grid;gap:9px;margin-top:20px}.choice{border:1px solid #dce8dd;background:white;color:#344b3b;text-align:left;border-radius:12px;padding:14px}.choice:hover,.choice.selected{border-color:#4ba774;background:#f0faf2;color:#257649}.actions{display:flex;gap:10px;margin-top:22px}.note{font-size:12px;color:#91a297;line-height:1.6;margin:16px 0 0}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e3ebe3;display:flex;justify-content:center;gap:8px;padding:10px 20px calc(10px + env(safe-area-inset-bottom));z-index:2}.nav a{color:#668072;text-decoration:none;text-align:center;padding:8px 18px;border-radius:12px;font-size:13px}.nav a:hover{background:#f0f8f1;color:#32845a}.nav span{display:block;font-size:20px;margin-bottom:3px}.notice{color:#72877a;font-size:13px;margin:15px 0 0}@media(max-width:760px){main{margin:25px auto 110px}.layout{grid-template-columns:1fr;gap:30px}.card{padding:24px}h1{margin:20px 0}.nav a{padding:8px 12px}}
</style></head><body><header><div class="logo">🌱 뻔뻔하게</div><button class="login" id="login" type="button">로그인</button></header><main><div class="layout"><section><span class="badge">캠퍼스 생활, 뻔뻔하게 물어봐요</span><h1>궁금한 건<br><span>뻔뻔하게!</span></h1><p class="intro">학교생활의 사소한 질문부터 진로 고민까지.<br>나와 맞는 선배에게 편하게 물어보세요.</p></section><section class="card" id="app" aria-live="polite"></section></div></main><nav class="nav" aria-label="하단 메뉴"><a href="./main.html"><span>☘</span>시작</a><a href="./concern/"><span>✍</span>고민 입력</a><a href="./result/"><span>✨</span>매칭 결과</a><a href="./chat/"><span>💬</span>채팅</a></nav><script>

const app=document.querySelector('#app');
let step=-1; const answers={status:'',reason:'',courses:[],ratings:{}};
const steps=[
 {key:'status',title:'현재 어떤 단계인가요?',hint:'나에게 해당하는 항목을 선택해 주세요.',options:['신입생','재학생','졸업준비생','졸업생']},
 {key:'reason',title:'어떤 도움을 받고 싶나요?',hint:'가장 관심 있는 분야를 선택해 주세요.',options:['학교적응','밥집 추천','전공지식','진로와 취업','대외활동']},
 {key:'ratings',title:'원하는 선배의 유형은?',hint:'각 특징이 나에게 얼마나 중요한지 1점부터 5점까지 골라주세요. (1점: 중요하지 않음, 5점: 매우 중요)',ratings:true}
];
document.querySelector('#login').onclick=()=>{document.querySelector('#login-message').textContent='로그인 기능은 준비 중이에요.'};
const courseStep={key:'courses',title:'어떤 수업을 듣고 있나요?',hint:'수업 이름을 검색해 선택하거나 직접 추가해 주세요.',courses:true};
const courseExamples=['프로그래밍 기초','자료구조','알고리즘','데이터베이스','운영체제','인공지능 개론','선형대수','미적분학'];
function render(){
 const activeSteps=answers.reason==='전공지식'?[...steps.slice(0,2),courseStep,steps[2]]:steps;
 if(step<0){app.innerHTML='<h2>무엇이든 물어볼 준비됐나요?</h2><p class="hint">학적 단계와 관심 분야, 원하는 선배의 특징을 알려주세요.</p><button class="primary start" id="start">시작하기 →</button><p class="notice" id="login-message" role="status"></p>';app.querySelector('#start').onclick=()=>{step=0;render()};return}
 const q=activeSteps[step];app.innerHTML=`<div class="top"><span>${step===0?'기본 정보':q.ratings?'선배 유형 선택':'관심 분야 선택'}</span><strong>${step+1} / ${activeSteps.length}</strong></div><div class="progress"><div class="bar" style="width:${(step+1)/activeSteps.length*100}%"></div></div><h2>${q.title}</h2><p class="hint">${q.hint}</p><div class="choices"></div><div class="actions"><button class="back" id="prev">이전</button><button class="primary" id="next">${step===activeSteps.length-1?'선택 완료':'다음'}</button></div><p class="note">선택 완료를 누르면 입력 내용을 선배 추천을 위해 서버로 보냅니다.</p><p class="notice" id="login-message" role="status"></p>`;
 const box=app.querySelector('.choices'),next=app.querySelector('#next');
 if(q.courses){const input=document.createElement('input');input.className='choice';input.placeholder='수업 이름 검색 또는 입력';input.setAttribute('aria-label','수업 검색');input.maxLength=100;box.appendChild(input);const helper=document.createElement('p');helper.className='hint';helper.textContent='아래 목록은 예시 수업입니다. 검색 결과가 없으면 직접 추가할 수 있어요.';box.appendChild(helper);const results=document.createElement('div');results.className='choices';results.style.marginTop='0';box.appendChild(results);const selected=document.createElement('div');box.appendChild(selected);function updateCourses(){results.replaceChildren();selected.replaceChildren();const value=input.value.trim();const found=value?courseExamples.filter(c=>c.toLowerCase().includes(value.toLowerCase())&&!answers.courses.includes(c)):[];found.forEach(c=>{const b=document.createElement('button');b.className='choice';b.style.width='100%';b.textContent='+ '+c;b.onclick=()=>add(c);results.appendChild(b)});if(value&&!answers.courses.some(c=>c.toLowerCase()===value.toLowerCase())&&!found.some(c=>c.toLowerCase()===value.toLowerCase())){const b=document.createElement('button');b.className='choice';b.style.width='100%';b.textContent='직접 추가: '+value;b.onclick=()=>add(value);results.appendChild(b)}const label=document.createElement('p');label.className='hint';label.textContent=answers.courses.length?'선택한 수업 (누르면 삭제)':'수업을 한 개 이상 추가해 주세요.';selected.appendChild(label);answers.courses.forEach(c=>{const b=document.createElement('button');b.className='choice selected';b.style.cssText='margin:0 6px 6px 0;padding:8px';b.textContent=c+' ×';b.setAttribute('aria-label',c+' 삭제');b.onclick=()=>{answers.courses=answers.courses.filter(x=>x!==c);updateCourses()};selected.appendChild(b)});next.disabled=answers.courses.length===0}function add(c){if(!answers.courses.some(x=>x.toLowerCase()===c.toLowerCase()))answers.courses.push(c);input.value='';updateCourses();input.focus()}input.oninput=updateCourses;updateCourses()}
 else if(q.fields){q.fields.forEach(([key,label])=>{const input=document.createElement('input');input.className='choice';input.placeholder=label+' (선택)';input.setAttribute('aria-label',label);input.maxLength=100;input.value=answers[key];input.oninput=()=>answers[key]=input.value;box.appendChild(input)})}
 else if(q.ratings){const common=[['friendly','친근하고 편하게 대해주는 선배'],['empathetic','고민을 공감하며 들어주는 선배']];const byReason={'전공지식':[['course_experience','같은 수업을 들어본 선배'],['academic_knowledge','전공과 수업 내용을 잘 아는 선배'],['study_advice','공부 방법을 구체적으로 알려주는 선배']], '밥집 추천':[['food_knowledge','학교 주변 밥집을 많이 아는 선배'],['food_preferences','취향에 맞는 메뉴를 추천해주는 선배'],['budget_food','가격과 가성비를 잘 알려주는 선배']], '학교적응':[['campus_life','학교생활과 적응을 잘 도와주는 선배'],['campus_resources','학교 시설과 제도를 잘 아는 선배'],['community','동아리와 교내 활동을 잘 아는 선배']], '진로와 취업':[['career_experience','진로와 취업 경험을 나눠주는 선배'],['career_advice','진로 준비 방법을 구체적으로 알려주는 선배'],['industry_knowledge','관심 분야의 직무를 잘 아는 선배']], '대외활동':[['activity_experience','대외활동 경험이 많은 선배'],['activity_search','활동을 찾는 방법을 잘 아는 선배'],['application_advice','지원 준비를 도와주는 선배']]};const items=[...common,...(byReason[answers.reason]||[])];const update=()=>{next.disabled=items.some(([key])=>!answers.ratings[key])};items.forEach(([key,label])=>{const group=document.createElement('fieldset');group.style.cssText='border:0;padding:0;margin:0 0 12px';const legend=document.createElement('legend');legend.textContent=label;legend.style.cssText='font-weight:700;font-size:14px;margin-bottom:10px';group.appendChild(legend);const row=document.createElement('div');row.style.cssText='display:flex;gap:6px';for(let score=1;score<=5;score++){const b=document.createElement('button');b.type='button';b.className='choice'+(answers.ratings[key]===score?' selected':'');b.style.cssText='flex:1;text-align:center;padding:10px 0';b.textContent=score;b.setAttribute('aria-label',label+' '+score+'점');b.setAttribute('aria-pressed',String(answers.ratings[key]===score));b.onclick=()=>{answers.ratings[key]=score;Array.from(row.children).forEach((el,i)=>{el.classList.toggle('selected',i+1===score);el.setAttribute('aria-pressed',String(i+1===score))});update()};row.appendChild(b)}group.appendChild(row);box.appendChild(group)});update()}
 else if(q.textarea){const area=document.createElement('textarea');area.className='choice';area.rows=4;area.maxLength=1000;area.placeholder='예: 비슷한 전공의 선배와 편하게 대화하고 싶어요.';area.setAttribute('aria-label','추가 취향');area.value=answers[q.key];area.oninput=()=>answers[q.key]=area.value;box.appendChild(area)}
 else{const opts=typeof q.options==='function'?q.options():q.options;opts.forEach(o=>{const b=document.createElement('button');b.className='choice'+(answers[q.key]===o?' selected':'');b.textContent=o;b.setAttribute('aria-pressed',String(answers[q.key]===o));b.onclick=()=>{if(q.key==='reason'&&answers.reason!==o){answers.courses=[];answers.ratings={}};answers[q.key]=o;render()};box.appendChild(b)});next.disabled=!answers[q.key]}
 next.onclick=async()=>{if(step<activeSteps.length-1){step++;render();return}
 const payload={schema_version:1,basic_info:{status:answers.status},interests:{reason:answers.reason,courses:answers.reason==='전공지식'?[...answers.courses]:[]},preferences:{ratings:{...answers.ratings}}};
 const labels={friendly:'친근함',empathetic:'공감 능력',course_experience:'같은 수업 경험',academic_knowledge:'전공 지식',study_advice:'공부 방법 조언',food_knowledge:'밥집 지식',food_preferences:'취향에 맞는 메뉴 추천',budget_food:'가성비 정보',campus_life:'학교생활 적응',campus_resources:'학교 시설과 제도',community:'동아리와 교내 활동',career_experience:'진로와 취업 경험',career_advice:'진로 준비 조언',industry_knowledge:'직무 지식',activity_experience:'대외활동 경험',activity_search:'활동 탐색',application_advice:'지원 준비 조언'};
 const ratingText=Object.entries(answers.ratings).map(([key,value])=>`${labels[key]||key}: ${value}점`).join(', ');
 const request={extraction:{interests:payload.interests.courses,help_fields:[answers.reason],situation:`학적: ${answers.status}. 이용 이유: ${answers.reason}. 수업: ${payload.interests.courses.join(', ')||'없음'}. 선호도 (1~5점): ${ratingText}`},top_k:3};
 const notice=app.querySelector('#login-message');next.disabled=true;app.querySelector('#prev').disabled=true;next.textContent='추천 요청 중...';notice.textContent='';
 try{sessionStorage.setItem('ppunppun-choice',JSON.stringify(payload));const response=await fetch('http://127.0.0.1:8000/api/match',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(request)});if(!response.ok)throw new Error(`서버 오류 (${response.status})`);const result=await response.json();sessionStorage.setItem('ppunppun-match',JSON.stringify(result));
 app.innerHTML='<h2>추천 요청을 완료했어요</h2><p class="hint">선택한 정보와 추천 결과를 이 브라우저에 저장했어요.</p><div class="choices" id="results"></div><p class="note">추천 결과 화면은 준비 중입니다.</p>';const list=app.querySelector('#results');if(!result.matches?.length){list.textContent='현재 조건에 맞는 선배를 찾지 못했어요.'}else result.matches.forEach(mentor=>{const card=document.createElement('div');card.className='choice';const title=document.createElement('strong');title.textContent=mentor.mentor_id+' · '+mentor.major;const reason=document.createElement('p');reason.className='hint';reason.textContent=(mentor.reasons||[]).join(' / ');card.append(title,reason);list.appendChild(card)})
 }catch(error){notice.textContent='추천 요청에 실패했어요. 서버가 실행 중인지 확인하고 다시 시도해 주세요.';next.disabled=false;app.querySelector('#prev').disabled=false;next.textContent='다시 시도'}
 };
 app.querySelector('#prev').onclick=()=>{step--;render()};
}render();
</script></body></html>
