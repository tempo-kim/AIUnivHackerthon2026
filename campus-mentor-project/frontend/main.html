<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>뻔뻔하게</title>
  <link rel="stylesheet" href="./shared/styles.css">
</head>
<body>
  <header>
    <div class="logo">🌱 뻔뻔하게</div>
    <button class="login" id="login" type="button">로그인</button>
  </header>
  <main>
    <div class="layout">
      <section>
        <span class="badge">캠퍼스 생활, 뻔뻔하게 물어봐요</span>
        <h1>궁금한 건<br><span>뻔뻔하게!</span></h1>
        <p class="intro">학교생활의 사소한 질문부터 진로 고민까지.<br>나와 맞는 선배에게 편하게 물어보세요.</p>
      </section>
      <section class="card" id="app" aria-live="polite"></section>
    </div>
  </main>
  <nav class="nav" aria-label="하단 메뉴">
    <a class="active" href="./main.html"><span>☘</span>시작</a>
    <a href="./concern/"><span>✍</span>고민 입력</a>
    <a href="./result/"><span>✨</span>매칭 결과</a>
    <a href="./chat/"><span>💬</span>채팅(추후)</a>
  </nav>
  <script>
    const app = document.querySelector('#app');
    const reasons = {
      '학교적응': ['학교생활', '동아리와 모임', '친구 사귀기', '기타'],
      '밥집': ['학교 주변 밥집', '혼밥하기 좋은 곳', '카페와 디저트', '기타'],
      '전공과목': ['수강신청', '강의와 교수님', '공부 방법', '기타'],
      '진로와 취업': ['진로 탐색', '취업 준비', '대학원', '기타'],
      '대외활동': ['공모전', '인턴십', '대외활동 찾기', '기타'],
      '기타': ['직접 알아보고 싶어요']
    };
    let step = -1;
    const answers = { status: '', reason: '', detail: '' };

    document.querySelector('#login').onclick = () => {
      const el = document.querySelector('#login-message');
      if (el) el.textContent = '로그인은 아직 없습니다. 시연은 로그인 없이 진행합니다.';
    };

    function render() {
      if (step < 0) {
        app.innerHTML = `
          <h2>무엇이든 물어볼 준비됐나요?</h2>
          <p class="hint">간단한 질문에 답한 뒤, 고민을 적으면 AI가 맞는 선배를 찾아줘요.</p>
          <button class="primary start" id="start">시작하기 →</button>
          <p class="notice" id="login-message" role="status"></p>`;
        document.querySelector('#start').onclick = () => { step = 0; render(); };
        return;
      }

      const titles = ['현재 어떤 단계인가요?', '어떤 이유로 찾아오셨나요?', '어떤 이야기가 궁금한가요?'];
      const hints = ['나에게 해당하는 항목을 선택해 주세요.', '가장 관심 있는 분야를 하나 선택해 주세요.', '좀 더 자세한 관심사를 골라주세요.'];
      const keys = ['status', 'reason', 'detail'];
      const options = [['신입생', '재학생', '졸업준비생', '졸업생'], Object.keys(reasons), reasons[answers.reason] || []];
      const key = keys[step];

      app.innerHTML = `
        <div class="top"><span>관심 분야 선택</span><strong>${step + 1} / 3</strong></div>
        <div class="progress"><div class="bar" style="width:${(step + 1) / 3 * 100}%"></div></div>
        <h2>${titles[step]}</h2>
        <p class="hint">${hints[step]}</p>
        <div class="choices"></div>
        <div class="actions">
          <button class="back" id="prev">이전</button>
          <button class="primary" id="next" disabled>${step === 2 ? '고민 적으러 가기' : '다음'}</button>
        </div>
        <p class="note">선택값은 이 브라우저에만 잠깐 저장됩니다. 채팅은 추후 연결합니다.</p>
        <p class="notice" id="login-message" role="status"></p>`;

      const next = app.querySelector('#next');
      options[step].forEach((o) => {
        const b = document.createElement('button');
        b.className = 'choice' + (answers[key] === o ? ' selected' : '');
        b.textContent = o;
        b.onclick = () => {
          if (key === 'reason' && answers.reason !== o) answers.detail = '';
          answers[key] = o;
          render();
        };
        app.querySelector('.choices').appendChild(b);
      });
      next.disabled = !answers[key];
      next.onclick = () => {
        if (step < 2) {
          step++;
          render();
        } else {
          try { sessionStorage.setItem('ppunppun-choice', JSON.stringify(answers)); } catch (e) {}
          location.href = './concern/';
        }
      };
      app.querySelector('#prev').onclick = () => { step--; render(); };
    }
    render();
  </script>
</body>
</html>
