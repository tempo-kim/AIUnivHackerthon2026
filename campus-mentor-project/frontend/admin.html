<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>뻔뻔하게 관리자 화면</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f6f7fd;color:#1b2451;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  [hidden]{display:none !important}
  header{max-width:880px;margin:auto;padding:24px 16px 8px;display:flex;align-items:center;gap:14px}
  header img{height:44px}
  header h1{margin:0;font-size:22px;flex:1}
  main{max-width:880px;margin:auto;padding:8px 16px 40px}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:12px 0 20px}
  .stat{background:#fff;border:1px solid #e1e5f5;border-radius:18px;padding:18px}
  .stat span{display:block;font-size:13px;color:#647092}
  .stat strong{display:block;font-size:30px;margin-top:6px}
  .stat.active strong{color:#345fe0}
  .list-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
  .list-head h2{margin:0;font-size:17px}
  .updated{font-size:12px;color:#8a93ad}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
  li{background:#fff;border:1px solid #e1e5f5;border-radius:16px;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;transition:background .6s,border-color .6s}
  li.new{background:#fff8e1;border-color:#f3c64d;box-shadow:0 6px 20px #f3c64d33}
  .pair{flex:1 1 260px;font-weight:700;font-size:16px;word-break:keep-all;overflow-wrap:anywhere}
  .pair .arrow{color:#8a93ad;margin:0 6px}
  .meta{font-size:13px;color:#647092;display:flex;gap:12px;flex-wrap:wrap}
  .badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
  .badge.new{background:#f3c64d;color:#3d2c00}
  .badge.on{background:#e3ebff;color:#2b4fc2}
  .badge.off{background:#eceef4;color:#69728c}
  .badge.reported{background:#ffe1e1;color:#b42323}
  .empty,.error{text-align:center;color:#647092;padding:28px 0}
  .error{color:#c03a3a}
  .tabs{display:flex;gap:8px;margin:8px 0 4px}
  .tab{border:1px solid #dce2f5;background:#fff;color:#647092;border-radius:12px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}
  .tab[aria-selected="true"]{background:#345fe0;border-color:#345fe0;color:#fff}
  .tab .count{display:inline-block;min-width:20px;margin-left:6px;border-radius:999px;background:#f3c64d;color:#3d2c00;font-size:12px;padding:1px 6px}
  .btn{border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;background:#345fe0;color:#fff}
  .btn.ghost{background:#fff;color:#647092;border:1px solid #dce2f5;padding:9px 14px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  /* 비밀번호 화면 */
  .login-view{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .login-card{width:100%;max-width:380px;background:#fff;border:1px solid #e1e5f5;border-radius:24px;padding:28px 24px;text-align:center;box-shadow:0 18px 60px #30346b10}
  .login-card img{height:56px;margin-bottom:12px}
  .login-card h1{margin:0 0 6px;font-size:22px}
  .login-card p{margin:0 0 18px;font-size:13px;color:#647092}
  .login-card input{width:100%;font:inherit;padding:13px 14px;border:1px solid #dce2f5;border-radius:12px;margin-bottom:12px}
  .login-card input:focus{outline:3px solid #345fe033;border-color:#345fe0}
  .login-card .btn{width:100%}
  .form-error{color:#c03a3a;font-size:13px;margin:12px 0 0;min-height:1.2em}
  .back-home{display:inline-block;margin-top:14px;font-size:13px;color:#647092}
  /* 신고 */
  li.report{cursor:pointer;flex-direction:column;align-items:stretch}
  li.report:hover,li.report:focus-visible{border-color:#345fe0;outline:none}
  li.report.selected{border-color:#345fe0;box-shadow:0 0 0 2px #345fe033}
  .report-top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
  .report-target{font-weight:700}
  .report-reason{font-size:14px}
  .report-detail{font-size:13px;color:#4d5878;white-space:pre-wrap;overflow-wrap:anywhere}
  .viewer{margin-top:20px;background:#fff;border:1px solid #e1e5f5;border-radius:18px;padding:18px}
  .viewer h3{margin:0 0 4px;font-size:16px}
  .viewer .hint{margin:0 0 12px;font-size:12px;color:#8a93ad}
  .msgs{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto}
  .msg{max-width:80%;padding:10px 12px;border-radius:14px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
  .msg.junior{align-self:flex-start;background:#eef0fb}
  .msg.senior{align-self:flex-end;background:#e3ebff}
  .msg small{display:block;font-size:11px;color:#8a93ad;margin-bottom:3px}
  @media(max-width:480px){header h1{font-size:18px}header img{height:36px}.stat strong{font-size:24px}}
</style>
</head>
<body>
<!-- 첫 화면: 관리자 비밀번호 -->
<section class="login-view" id="login-view" hidden>
  <form class="login-card" id="admin-login" novalidate>
    <img src="./assets/brand-logo.png" alt="뻔뻔하게" />
    <h1>관리자 로그인</h1>
    <p>관리자 비밀번호를 입력해 주세요.</p>
    <input type="password" id="admin-password" autocomplete="current-password" aria-label="관리자 비밀번호" placeholder="관리자 비밀번호" />
    <button class="btn" id="admin-login-btn" type="submit">확인</button>
    <p class="form-error" id="admin-login-error" role="alert"></p>
    <a class="back-home" href="./main.html">← 처음 화면으로</a>
  </form>
</section>

<!-- 로그인 후: 매칭 목록 + 신고 -->
<div id="app-view" hidden>
  <header>
    <img src="./assets/brand-logo.png" alt="뻔뻔하게" />
    <h1>뻔뻔하게 관리자 화면</h1>
    <button class="btn ghost" id="admin-logout" type="button">로그아웃</button>
  </header>
  <main>
    <nav class="tabs" role="tablist" aria-label="관리자 메뉴">
      <button class="tab" role="tab" id="tab-matches" aria-selected="true" aria-controls="panel-matches">매칭</button>
      <button class="tab" role="tab" id="tab-reports" aria-selected="false" aria-controls="panel-reports">신고<span class="count" id="new-report-count" hidden></span></button>
    </nav>

    <section id="panel-matches" role="tabpanel" aria-labelledby="tab-matches">
      <section class="stats" aria-label="요약">
        <div class="stat"><span>총 매칭 수</span><strong id="total">-</strong></div>
        <div class="stat active"><span>진행 중 대화</span><strong id="active">-</strong></div>
      </section>
      <div class="list-head">
        <h2>매칭 목록</h2>
        <span class="updated" id="updated" aria-live="polite"></span>
      </div>
      <ul id="list"></ul>
      <p class="empty" id="empty" hidden>아직 매칭된 대화가 없어요.</p>
      <p class="error" id="error" role="alert" hidden>목록을 불러오지 못했어요. 서버 연결을 확인해 주세요.</p>
    </section>

    <section id="panel-reports" role="tabpanel" aria-labelledby="tab-reports" hidden>
      <div class="list-head"><h2>신고 목록</h2></div>
      <ul id="report-list"></ul>
      <p class="empty" id="report-empty" hidden>아직 접수된 신고가 없어요.</p>
      <p class="error" id="report-error" role="alert" hidden></p>
      <section class="viewer" id="viewer" hidden aria-live="polite">
        <h3 id="viewer-title"></h3>
        <p class="hint">읽기 전용 · 신고된 대화만 볼 수 있어요</p>
        <div class="msgs" id="viewer-msgs"></div>
      </section>
    </section>
  </main>
</div>

<script>
// 시연용 관리자 화면. 매칭 목록에는 메시지 내용이 없고, 신고된 대화만 열람 가능
const POLL_MS = 2000;
const NEW_BADGE_MS = 30000; // "새 매칭"·"새 신고" 표시 유지 시간
const API_BASE = location.protocol === 'file:' ? 'http://127.0.0.1:8000' : '';
const ADMIN_TOKEN_KEY = 'ppunppun-admin-token';
const $ = (id) => document.getElementById(id);

let pollTimer = null;
const seenMatches = new Set();
const newMatches = new Map();
let firstMatchLoad = true;
const seenReports = new Set();
const newReports = new Map();
let firstReportLoad = true;
let selectedReportId = null;
let loading = false;

function adminToken() { try { return sessionStorage.getItem(ADMIN_TOKEN_KEY) || ''; } catch { return ''; } }
function setAdminToken(token) { try { if (token) sessionStorage.setItem(ADMIN_TOKEN_KEY, token); else sessionStorage.removeItem(ADMIN_TOKEN_KEY); } catch {} }

function formatTime(value) {
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return '';
  const time = d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  return d.toDateString() === new Date().toDateString() ? time : `${d.getMonth() + 1}/${d.getDate()} ${time}`;
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

// ---- 화면 전환 ----
function showLogin(message) {
  clearInterval(pollTimer);
  pollTimer = null;
  setAdminToken('');
  seenMatches.clear(); newMatches.clear(); firstMatchLoad = true;
  seenReports.clear(); newReports.clear(); firstReportLoad = true; selectedReportId = null;
  $('list').replaceChildren(); $('report-list').replaceChildren(); $('viewer').hidden = true;
  $('app-view').hidden = true;
  $('login-view').hidden = false;
  $('admin-login-error').textContent = message || '';
  $('admin-password').value = '';
  $('admin-password').focus();
}

function showApp() {
  $('login-view').hidden = true;
  $('app-view').hidden = false;
  refreshAll();
  clearInterval(pollTimer);
  pollTimer = setInterval(refreshAll, POLL_MS);
}

$('admin-logout').onclick = () => showLogin();

// Enter로도 제출(form submit)
$('admin-login').onsubmit = async (event) => {
  event.preventDefault();
  const btn = $('admin-login-btn');
  btn.disabled = true;
  $('admin-login-error').textContent = '';
  try {
    const res = await fetch(`${API_BASE}/api/admin/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: $('admin-password').value }),
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.token) {
      setAdminToken(data.token);
      $('admin-password').value = '';
      showApp();
      return;
    }
    $('admin-login-error').textContent =
      res.status === 401 ? '비밀번호가 맞지 않아요'
      : res.status === 429 ? '잠시 후 다시 시도해 주세요'
      : res.status === 503 ? '서버에 관리자 비밀번호가 설정되지 않았어요'
      : '로그인하지 못했어요. 다시 시도해 주세요';
    $('admin-password').select();
  } catch {
    $('admin-login-error').textContent = '서버에 연결하지 못했어요';
  } finally {
    btn.disabled = false;
  }
};

// 토큰이 만료·무효면(401) 비밀번호 화면으로
async function adminFetch(path) {
  const res = await fetch(`${API_BASE}${path}`, { headers: { Authorization: `Bearer ${adminToken()}` }, cache: 'no-store' });
  if (res.status === 401) { showLogin('다시 로그인해 주세요'); throw new Error('401'); }
  if (!res.ok) { const err = new Error(String(res.status)); err.status = res.status; throw err; }
  return res.json();
}

// ---- 탭 ----
function selectTab(name) {
  const reports = name === 'reports';
  $('tab-matches').setAttribute('aria-selected', String(!reports));
  $('tab-reports').setAttribute('aria-selected', String(reports));
  $('panel-matches').hidden = reports;
  $('panel-reports').hidden = !reports;
}
$('tab-matches').onclick = () => selectTab('matches');
$('tab-reports').onclick = () => selectTab('reports');

// ---- 매칭 목록 ----
const matchKey = (m) => `${m.mentorId}|${m.juniorName}|${m.createdAt}`;

function renderMatches(matches) {
  const now = Date.now();
  matches.forEach((m) => {
    const key = matchKey(m);
    if (!seenMatches.has(key)) {
      seenMatches.add(key);
      if (!firstMatchLoad) newMatches.set(key, now); // 처음 열었을 때 있던 매칭은 새 매칭으로 보지 않음
    }
  });
  firstMatchLoad = false;
  const isNew = (m) => newMatches.has(matchKey(m)) && now - newMatches.get(matchKey(m)) < NEW_BADGE_MS;
  const ordered = [...matches.filter(isNew), ...matches.filter((m) => !isNew(m))];
  const items = ordered.map((m) => {
    const li = el('li', isNew(m) ? 'new' : '');
    const pair = el('div', 'pair');
    if (isNew(m)) pair.append(el('span', 'badge new', '새 매칭'), ' ');
    pair.append(m.juniorName || '이름 없는 후배', el('span', 'arrow', '→'), m.mentorName || m.mentorId);
    const meta = el('div', 'meta');
    meta.append(el('span', '', `연결 ${formatTime(m.createdAt)}`), el('span', '', `메시지 ${m.messageCount}개`));
    const ended = m.status === 'ended';
    li.append(pair, meta);
    if (m.reported) li.append(el('span', 'badge reported', '신고됨'));
    li.append(el('span', `badge ${ended ? 'off' : 'on'}`, ended ? '종료' : '진행중'));
    return li;
  });
  $('list').replaceChildren(...items);
  $('empty').hidden = matches.length > 0;
  $('total').textContent = matches.length;
  $('active').textContent = matches.filter((m) => m.status !== 'ended').length;
}

// ---- 신고 목록 ----
function renderReports(reports) {
  const now = Date.now();
  reports.forEach((r) => {
    if (!seenReports.has(r.reportId)) {
      seenReports.add(r.reportId);
      if (!firstReportLoad) newReports.set(r.reportId, now);
    }
  });
  firstReportLoad = false;
  const isNew = (r) => newReports.has(r.reportId) && now - newReports.get(r.reportId) < NEW_BADGE_MS;
  const items = reports.map((r) => {
    const li = el('li', `report${isNew(r) ? ' new' : ''}${r.reportId === selectedReportId ? ' selected' : ''}`);
    li.tabIndex = 0;
    li.setAttribute('role', 'button');
    const top = el('div', 'report-top');
    if (isNew(r)) top.append(el('span', 'badge new', '새 신고'));
    top.append(el('span', 'badge reported', `${r.reporterRole} 신고`));
    top.append(el('span', 'report-target', `${r.juniorName || '이름 없는 후배'} → ${r.mentorName}`));
    top.append(el('span', 'updated', formatTime(r.createdAt)));
    li.append(top, el('div', 'report-reason', `사유: ${r.reason}`), el('div', 'report-detail', r.detail));
    const open = () => openReport(r);
    li.onclick = open;
    li.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
    return li;
  });
  $('report-list').replaceChildren(...items);
  $('report-empty').hidden = reports.length > 0;
  const fresh = reports.filter(isNew).length;
  $('new-report-count').hidden = fresh === 0;
  $('new-report-count').textContent = fresh;
}

async function openReport(report) {
  selectedReportId = report.reportId;
  document.querySelectorAll('#report-list li').forEach((li) => li.classList.remove('selected'));
  $('viewer').hidden = false;
  $('viewer-title').textContent = `${report.juniorName || '이름 없는 후배'} ↔ ${report.mentorName} 대화`;
  $('viewer-msgs').replaceChildren(el('p', 'updated', '불러오는 중...'));
  try {
    const messages = await adminFetch(`/api/admin/reports/${encodeURIComponent(report.reportId)}/messages`);
    if (selectedReportId !== report.reportId) return;
    const nodes = messages.map((m) => {
      const box = el('div', `msg ${m.senderRole === 'senior' ? 'senior' : 'junior'}`);
      box.append(el('small', '', `${m.senderRole === 'senior' ? '선배' : '후배'} · ${formatTime(m.createdAt)}`), m.text);
      return box;
    });
    $('viewer-msgs').replaceChildren(...(nodes.length ? nodes : [el('p', 'updated', '메시지가 없어요.')]));
  } catch (err) {
    if (err.message !== '401') $('viewer-msgs').replaceChildren(el('p', 'error', '대화를 불러오지 못했어요.'));
  }
}

// ---- 2초마다 매칭·신고 함께 갱신 ----
async function refreshAll() {
  if (loading || !adminToken()) return;
  loading = true;
  try {
    const [matches, reports] = await Promise.allSettled([adminFetch('/api/admin/matches'), adminFetch('/api/admin/reports')]);
    if (!adminToken()) return; // 401로 로그아웃됨
    if (matches.status === 'fulfilled') {
      renderMatches(matches.value);
      $('error').hidden = true;
      $('updated').textContent = `마지막 갱신 ${formatTime(new Date())}`;
    } else {
      $('error').hidden = false;
    }
    if (reports.status === 'fulfilled') {
      renderReports(reports.value);
      $('report-error').hidden = true;
    } else {
      $('report-error').textContent = '신고 목록을 불러오지 못했어요.';
      $('report-error').hidden = false;
    }
  } finally {
    loading = false;
  }
}

// 저장된 토큰이 있으면 바로 목록(무효면 첫 요청의 401로 비밀번호 화면), 없으면 비밀번호 화면
if (adminToken()) showApp(); else showLogin();
</script>
</body>
</html>
