<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>선배 선택 | 뻔뻔하게</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f9f4;color:#25372b;font-family:Pretendard,'Malgun Gothic',sans-serif}header{max-width:1080px;margin:auto;padding:24px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:22px;font-weight:900;color:#358158;text-decoration:none}.home{color:#617767;text-decoration:none;font-size:14px}main{max-width:1000px;margin:48px auto 120px;padding:0 24px}.badge{display:inline-block;background:#e1f2e6;color:#328359;padding:9px 14px;border-radius:30px;font-weight:700;font-size:13px}h1{font-size:clamp(30px,4vw,42px);letter-spacing:-.05em;margin:20px 0 10px}.intro{line-height:1.7;color:#718579}.notice{background:#edf6ed;color:#55715e;padding:14px 17px;border-radius:12px;font-size:13px;line-height:1.6;margin:25px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid #e2ede3;border-radius:22px;padding:24px;box-shadow:0 18px 50px #274e300d;display:flex;flex-direction:column}.avatar{width:52px;height:52px;border-radius:18px;background:#e1f2e6;color:#328359;display:grid;place-items:center;font-size:22px;font-weight:700}.card h2{font-size:20px;margin:18px 0 5px}.meta{color:#7b8d80;font-size:13px;margin:0}.reason{line-height:1.7;color:#607668;font-size:14px;flex:1;margin:20px 0}.button{display:block;text-align:center;text-decoration:none;background:#398c5d;color:white;padding:14px;border-radius:12px;font-size:14px;font-weight:700}.button:hover{background:#2d754d}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e3ebe3;display:flex;justify-content:center;gap:8px;padding:10px 20px calc(10px + env(safe-area-inset-bottom))}.nav a{color:#668072;text-decoration:none;text-align:center;padding:8px 45px;border-radius:12px;font-size:13px}.nav span{display:block;font-size:20px;margin-bottom:3px}@media(max-width:760px){main{margin:25px auto 110px}.grid{grid-template-columns:1fr}.nav a{padding:8px 35px}}
</style></head><body>
<header><a class="logo" href="../main.html">🌱 뻔뻔하게</a><a class="home" href="../main.html">← 처음으로</a></header>
<main><span class="badge">나와 함께할 선배 찾기</span><h1>어떤 선배와 이야기해 볼까요?</h1><p class="intro">선배의 이야기를 살펴보고 편하게 대화를 시작해 보세요.</p><p class="notice">화면을 확인할 수 있도록 예시 선배를 보여드리고 있어요. 선택하면 예시 채팅으로 이동합니다.</p><div class="grid" id="mentors"></div></main>
<nav class="nav" aria-label="하단 메뉴"><a href="./index.html"><span>☘</span>선택창</a><a href="../chat/index.html?role=junior&amp;mentor=1"><span>💬</span>예시 채팅</a></nav>
<script src="../chat/mock-data.js"></script>
<script>
const list=document.querySelector('#mentors');
MOCK_MENTORS.forEach((mentor,index)=>{const card=document.createElement('article');card.className='card';const avatar=document.createElement('div');avatar.className='avatar';avatar.setAttribute('aria-hidden','true');avatar.textContent=mentor.name.charAt(0);const name=document.createElement('h2');name.textContent=mentor.name+' 선배';const meta=document.createElement('p');meta.className='meta';meta.textContent=mentor.grade+' · '+mentor.major;const reason=document.createElement('p');reason.className='reason';reason.textContent=mentor.reason;const link=document.createElement('a');link.className='button';link.href='../chat/index.html?role=junior&mentor='+(index+1);link.textContent='대화 시작하기 →';card.append(avatar,name,meta,reason,link);list.appendChild(card)});
</script></body></html>
