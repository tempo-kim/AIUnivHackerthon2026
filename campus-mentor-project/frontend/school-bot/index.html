<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>학교 챗봇 · 뻔뻔하게</title>
  <link rel="stylesheet" href="../shared/styles.css" />
  <style>
    body { background: #f7f8ff; color: #1b2451; }
    .bot-shell { max-width: 720px; margin: 24px auto 110px; padding: 0 20px; }
    .bot-card { background: #fff; border: 1px solid #e1e5f5; border-radius: 20px; padding: 20px; box-shadow: 0 12px 40px #30346b12; }
    .bot-log { display: grid; gap: 10px; max-height: 55vh; overflow: auto; padding: 4px; margin-bottom: 14px; }
    .bubble { border-radius: 14px; padding: 12px 14px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; }
    .bubble.user { background: #edeaff; color: #3d2f86; justify-self: end; max-width: 85%; }
    .bubble.bot { background: #f3f5fb; color: #243056; justify-self: start; max-width: 90%; }
    .bubble.typing { color: #687398; font-style: italic; opacity: .9; }
    .meta { font-size: 12px; color: #8590a9; margin-top: 8px; }
    .composer { display: flex; gap: 8px; }
    .composer textarea { flex: 1; min-height: 54px; border: 1px solid #dce2f5; border-radius: 12px; padding: 12px; font: inherit; resize: vertical; }
    .composer button { border: 0; border-radius: 12px; background: #345fe0; color: #fff; font-weight: 700; padding: 0 18px; cursor: pointer; }
    .composer button:disabled { opacity: .45; cursor: not-allowed; }
    .error { color: #b42318; font-size: 13px; margin-top: 10px; }
    header { max-width: 720px; margin: auto; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Pretendard, 'Malgun Gothic', sans-serif; }
    header { max-width:1080px; padding:24px; }
    .logo a { display:inline-flex; align-items:center; line-height:0; }
    .logo img { display:block; width:150px; height:90px; object-fit:contain; mix-blend-mode:multiply; }
    .home-link { color:#687398; text-decoration:none; font-size:14px; }
    .bot-shell { max-width:800px; margin:38px auto 130px; padding:0 24px; }
    .bot-card { border-radius:24px; padding:32px; box-shadow:0 18px 60px #30346b10; }
    .bot-badge { display:inline-block; background:#edeaff; color:#6140c4; padding:9px 14px; border-radius:30px; font-size:13px; font-weight:700; margin-bottom:18px; }
    .bot-title { margin:0 0 10px; font-size:clamp(26px,4vw,36px); letter-spacing:-.05em; }
    .bot-log { min-height:180px; margin:24px 0 18px; }
    .composer textarea { color:#28335e; line-height:1.6; }
    .composer textarea:focus-visible, .composer button:focus-visible { outline:3px solid #a996f2; outline-offset:2px; }
    .composer button:hover:not(:disabled) { background:#254bc1; }
    .nav { position:fixed; bottom:0; left:0; right:0; z-index:2; background:white; border-top:1px solid #e2e5f3; display:flex; justify-content:center; gap:8px; padding:10px 20px calc(10px + env(safe-area-inset-bottom)); }
    .nav a { color:#687398; text-decoration:none; text-align:center; padding:8px 22px; border-radius:12px; font-size:13px; }
    .nav a:hover { background:#f0efff; color:#5e43c8; } .nav span { display:block; font-size:20px; margin-bottom:3px; }
    @media(max-width:760px) { header{padding:20px 24px}.logo img{width:120px;height:72px}.bot-shell{margin:25px auto 120px}.bot-card{padding:24px}.nav a{padding:8px 14px} }
    @media(max-width:400px) { .composer { flex-direction:column; } .composer button { min-height:48px; } }

  </style>
</head>
<body>
  <header>
    <div class="logo"><a href="../main.html"><img src="../assets/brand-logo.png" alt="뻔뻔하게 홈"></a></div>
    <a class="home-link" href="../main.html">← 처음으로</a>
  </header>
  <main class="bot-shell">
    <section class="bot-card">
      <span class="bot-badge">캠퍼스 생활, 뻔뻔하게 물어봐요</span>
      <h1 class="bot-title">학교 생활 챗봇</h1>
      <p class="meta" id="school-label">선택한 학교의 선배·후배 채팅을 익명으로 모아, 매칭과 같은 AI로 학교 얘기를 답해 줍니다.</p>
      <div class="bot-log" id="log" aria-live="polite"></div>
      <form class="composer" id="form">
        <textarea id="question" placeholder="예: 우리 학교 수강신청할 때 사람들이 뭐라고 해요?" maxlength="1000" required></textarea>
        <button type="submit" id="send">묻기</button>
      </form>
      <p class="error" id="error" hidden></p>
      <p class="meta" id="status"></p>
    </section>
  </main>

  <nav class="nav" aria-label="하단 메뉴">
    <a href="../main.html"><span>☘</span>홈</a>
    <a class="active" href="./"><span>🤖</span>학교봇</a>
    <a href="../result/index.html"><span>💬</span>채팅창</a>
  </nav>

  <script src="../shared/api.js"></script>
  <script>
    const log = document.querySelector('#log');
    const form = document.querySelector('#form');
    const input = document.querySelector('#question');
    const send = document.querySelector('#send');
    const error = document.querySelector('#error');
    const status = document.querySelector('#status');
    const school = localStorage.getItem('ppunppun-school') || sessionStorage.getItem('ppunppun-school') || '';
    document.querySelector('#school-label').textContent =
      (school ? `선택한 학교: ${school}. ` : '') +
      '선배·후배 채팅을 익명으로 모아, 매칭과 같은 AI로 학교 얘기를 답해 줍니다.';

    function addBubble(role, text) {
      const el = document.createElement('div');
      el.className = 'bubble ' + role;
      el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    addBubble(
      'bot',
      (school ? `${school} ` : '') +
        '학교 시연 데이터가 준비돼 있어요. 서울대·고려대·연세대·이화여대·서울과기대·서강대 각 200채팅(채팅마다 선후배 대화 30말 이상)을 조회해 답합니다. 맛집·전공 질문을 해보세요.'
    );

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;
      error.hidden = true;
      addBubble('user', question);
      input.value = '';
      send.disabled = true;
      status.textContent = '데이터베이스 조회중입니다';
      const typing = addBubble('bot', '데이터베이스 조회중입니다');
      typing.classList.add('typing');
      try {
        const data = await MentorApi.schoolBot({ question, school, history_limit: 80 });
        typing.classList.remove('typing');
        typing.textContent = data.answer || '(빈 응답)';
        status.textContent =
          `참고 채팅 ${data.used_conversation_count || 0}개 / 메시지 ${data.used_message_count || 0}개` +
          ` · 시드 채팅 ${data.seed_conversation_count || 0}개` +
          (data.school ? ` · ${data.school}` : '') +
          ` · source=${data.source || '-'}`;
      } catch (err) {
        typing.remove();
        error.hidden = false;
        error.textContent = err.message || String(err);
        status.textContent = '';
        addBubble('bot', '지금은 답변을 가져오지 못했어요. 서버가 켜져 있는지 확인해 주세요.');
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
<script src="../assets/achievements.js"></script>
<script src="../assets/common-nav.js"></script>
</body>
</html>
